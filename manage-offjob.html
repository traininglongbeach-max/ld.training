        .container {

        .header-section {

            color: #1e3a5f;

        .btn-add {
            background: linear-gradient(135deg, #2b7a4b, #1e5a38);

        .search-box {
            display: flex;

            background: white;
            border-radius: 1rem;

        .search-box input {

        .card {

        .list-item {

        .item-info {

        .item-badge {

        .item-desc {
            font-size: 0.85rem;

        }

        .item-actions {
            display: flex;
            gap: 0.5rem;

        .item-actions button {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;

            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-edit {
            background: #ed8936;
        }

        .btn-edit:hover {
            background: #dd6b20;
        }

        .btn-delete {

        }

        .btn-delete:hover {

        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #a0aec0;

        .empty-state i {

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            justify-content: center;

            padding: 1rem;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            border-radius: 1.5rem;

            width: 100%;
            max-width: 600px;

            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);

        @keyframes scaleIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }

            to {
                transform: scale(1);

        .modal-content h3 {

        .form-group {

        }

        .form-group label {
            display: block;
            font-size: 0.85rem;

            margin-bottom: 0.4rem;

        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.8rem;

            outline: none;
            transition: 0.3s;
            background: #f8fafc;
            color: #2d3748;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3182ce;

        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .modal-buttons button {
            flex: 1;
            padding: 0.8rem;
            font-size: 1rem;
            border-radius: 0.8rem;
        }

        .toast-msg {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #2b7a4b;
            color: white;
            padding: 1rem 2rem;
            border-radius: 2rem;
            text-align: center;
            z-index: 9999;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        .toast-msg.error {
            background: #e53e3e;
        }

        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;

    </style>
</head>

<body>

    <div id="app">
        <div style="text-align:center; padding:150px; font-size:1.5rem; color:#1e3a5f;">
            ⏳ جاري التحقق من الصلاحيات وتحميل البيانات...
        </div>
    </div>

    <script type="module">

        import { auth, DB } from './database.js';

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


        let courses = [];
        let sessions = [];
        let searchTerm = "";


        // =========================================================
        // HTML ESCAPE
        // =========================================================

        function escapeHtml(text) {

            if (!text) return '';

            const div = document.createElement('div');

            div.textContent = text;

            return div.innerHTML;
        }


        // =========================================================
        // FORMAT SESSION DATE FOR DISPLAY
        // يدعم Excel Serial Date مثل 46233
        // =========================================================

        function formatSessionDate(dateValue) {

            if (
                dateValue === null ||
                dateValue === undefined ||
                dateValue === ''
            ) {
                return '-';
            }


            // Excel Serial Date
            if (
                !isNaN(dateValue) &&
                Number(dateValue) > 30000
            ) {

                const excelSerial = Number(dateValue);

                const excelEpoch =
                    new Date(Date.UTC(1899, 11, 30));

                const date =
                    new Date(
                        excelEpoch.getTime() +
                        excelSerial * 86400000
                    );


                return date.toLocaleDateString(
                    'ar-EG',
                    {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    }
                );
            }


            // YYYY-MM-DD أو أي تاريخ صالح

            const date = new Date(dateValue);


            if (!isNaN(date.getTime())) {

                return date.toLocaleDateString(
                    'ar-EG',
                    {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    }
                );
            }


            return String(dateValue);
        }


        // =========================================================
        // FORMAT DATE FOR HTML INPUT TYPE DATE
        // =========================================================

        function formatDateForInput(dateValue) {

            if (
                dateValue === null ||
                dateValue === undefined ||
                dateValue === ''
            ) {
                return '';
            }


            // Excel Serial Date مثل 46233

            if (
                !isNaN(dateValue) &&
                Number(dateValue) > 30000
            ) {

                const excelSerial = Number(dateValue);

                const excelEpoch =
                    new Date(Date.UTC(1899, 11, 30));

                const date =
                    new Date(
                        excelEpoch.getTime() +
                        excelSerial * 86400000
                    );


                return date.toISOString().split('T')[0];
            }


            // YYYY-MM-DD أو أي تاريخ صالح

            const date = new Date(dateValue);


            if (!isNaN(date.getTime())) {

                return date.toISOString().split('T')[0];
            }


            return '';
        }


        // =========================================================
        // TOAST MESSAGE
        // =========================================================

        function showToast(msg, isError = false) {

            const toast =
                document.createElement('div');

            toast.className =
                'toast-msg' +
                (isError ? ' error' : '');

            toast.textContent = msg;

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }


        // =========================================================
        // LOAD DATA
        // =========================================================

        async function loadData() {

            await DB.init();

            courses =
                await DB.getAll('offjob_courses') || [];

            sessions =
                await DB.getAll('offjob_sessions') || [];

            renderUI();
        }


        // =========================================================
        // CHECK CODE EXISTS
        // =========================================================

        function isCodeExists(
            code,
            excludeCourseCode = null,
            excludeSessionCode = null
        ) {

            const courseExists =
                courses.some(
                    c =>
                        parseInt(c.course_code) === code &&
                        c.course_code !== excludeCourseCode
                );


            const sessionExists =
                sessions.some(
                    s =>
                        parseInt(s.session_code) === code &&
                        s.session_code !== excludeSessionCode
                );


            return courseExists || sessionExists;
        }


        // =========================================================
        // COURSES LOGIC
        // =========================================================

        window.openCourseModal = (code = null) => {

            const item =
                code
                    ? courses.find(
                        c =>
                            String(c.course_code) ===
                            String(code)
                    )
                    : null;


            document.getElementById(
                'courseModalTitle'
            ).innerHTML =

                item
                    ? '<i class="fas fa-edit"></i> تعديل كورس'
                    : '<i class="fas fa-plus-circle"></i> إضافة كورس جديد';


            document.getElementById('courseCode').value =
                item?.course_code || '';

            document.getElementById('courseName').value =
                item?.course_name || '';

            document.getElementById('courseDescription').value =
                item?.description || '';

            document.getElementById('courseCategory').value =
                item?.category || '';

            document.getElementById('courseTargetAudience').value =
                item?.target_audience || '';

            document.getElementById('courseDuration').value =
                item?.duration_hours || '';

            document.getElementById('courseTrainingType').value =
                item?.training_type || 'Off Job';

            document.getElementById('courseStatus').value =
                item?.status || 'Active';


            document.getElementById(
                'courseModal'
            ).dataset.editMode =
                item ? 'true' : 'false';


            document.getElementById(
                'courseModal'
            ).dataset.oldCode =
                item?.course_code || '';


            document.getElementById(
                'courseModal'
            ).style.display = 'flex';
        };


        window.saveCourse = async () => {

            const code =
                document.getElementById(
                    'courseCode'
                ).value.trim();


            const editMode =
                document.getElementById(
                    'courseModal'
                ).dataset.editMode === 'true';


            const oldCode =
                parseInt(
                    document.getElementById(
                        'courseModal'
                    ).dataset.oldCode
                );


            const newCodeNum =
                parseInt(code);


            if (
                !code ||
                !document.getElementById(
                    'courseName'
                ).value.trim() ||
                isNaN(newCodeNum)
            ) {

                showToast(
                    '❌ الرجاء إدخال كود صحيح واسم الكورس',
                    true
                );

                return;
            }


            const data = {

                id: String(newCodeNum),

                course_code: newCodeNum,

                course_name:
                    document.getElementById(
                        'courseName'
                    ).value.trim(),

                description:
                    document.getElementById(
                        'courseDescription'
                    ).value.trim(),

                category:
                    document.getElementById(
                        'courseCategory'
                    ).value.trim(),

                target_audience:
                    document.getElementById(
                        'courseTargetAudience'
                    ).value.trim(),

                duration_hours:
                    Number(
                        document.getElementById(
                            'courseDuration'
                        ).value
                    ) || 0,

                training_type:
                    document.getElementById(
                        'courseTrainingType'
                    ).value,

                status:
                    document.getElementById(
                        'courseStatus'
                    ).value
            };


            if (editMode) {

                if (
                    newCodeNum !== oldCode &&
                    isCodeExists(newCodeNum)
                ) {

                    showToast(
                        `❌ الكود ${newCodeNum} مستخدم بالفعل!`,
                        true
                    );

                    return;
                }


                if (newCodeNum !== oldCode) {

                    await DB.delete(
                        'offjob_courses',
                        String(oldCode)
                    );

                    await DB.insert(
                        'offjob_courses',
                        data
                    );

                } else {

                    await DB.update(
                        'offjob_courses',
                        data
                    );
                }


                const index =
                    courses.findIndex(
                        c =>
                            parseInt(c.course_code) ===
                            oldCode
                    );


                if (index !== -1) {
                    courses[index] = data;
                }


                showToast('✅ تم تحديث الكورس');

            } else {

                if (isCodeExists(newCodeNum)) {

                    showToast(
                        `❌ الكود ${newCodeNum} مستخدم بالفعل!`,
                        true
                    );

                    return;
                }


                await DB.insert(
                    'offjob_courses',
                    data
                );

                courses.push(data);

                showToast('✅ تم إضافة الكورس');
            }


            renderUI();

            window.closeModal('courseModal');
        };


        window.deleteCourse = async (courseCode) => {

            if (
                !confirm(
                    '⚠️ سيتم حذف هذا الكورس نهائياً! هل أنت متأكد؟'
                )
            ) {
                return;
            }


            const relatedSessions =
                sessions.filter(
                    s =>
                        parseInt(s.course_code) ===
                        parseInt(courseCode)
                );


            if (relatedSessions.length > 0) {

                if (
                    !confirm(
                        `⚠️ هذا الكورس مرتبط بـ ${relatedSessions.length} جلسات! حذفه قد يسبب مشاكل بالبيانات. الاستمرار؟`
                    )
                ) {
                    return;
                }
            }


            await DB.delete(
                'offjob_courses',
                String(courseCode)
            );


            courses =
                courses.filter(
                    c =>
                        parseInt(c.course_code) !==
                        parseInt(courseCode)
                );


            renderUI();

            showToast('🗑️ تم حذف الكورس');
        };


        // =========================================================
        // SESSIONS LOGIC
        // =========================================================

        window.openSessionModal = (code = null) => {

            const item =
                code
                    ? sessions.find(
                        s =>
                            String(s.session_code) ===
                            String(code)
                    )
                    : null;


            document.getElementById(
                'sessionModalTitle'
            ).innerHTML =

                item
                    ? '<i class="fas fa-edit"></i> تعديل جلسة'
                    : '<i class="fas fa-plus-circle"></i> إضافة جلسة جديدة';


            document.getElementById('sessionCode').value =
                item?.session_code || '';


            // تحويل التاريخ إلى YYYY-MM-DD
            document.getElementById('sessionDate').value =
                item && item.session_date
                    ? formatDateForInput(
                        item.session_date
                    )
                    : '';


            document.getElementById('trainerName').value =
                item?.trainer_name || '';

            document.getElementById('sessionStartTime').value =
                item?.start_time || '';

            document.getElementById('sessionEndTime').value =
                item?.end_time || '';

            document.getElementById('sessionLocation').value =
                item?.location || '';

            document.getElementById('sessionMaxCapacity').value =
                item?.max_capacity || '';

            document.getElementById('sessionStatus').value =
                item?.status || 'Active';

            document.getElementById('sessionNotes').value =
                item?.notes || '';


            // تعبئة قائمة الكورسات

            document.getElementById(
                'sessionCourseCode'
            ).innerHTML =

                '<option value="">اختر الكورس</option>' +

                [...courses]
                    .sort(
                        (a, b) =>
                            parseInt(a.course_code) -
                            parseInt(b.course_code)
                    )
                    .map(
                        c =>
                            `<option value="${c.course_code}" ${
                                item?.course_code == c.course_code
                                    ? 'selected'
                                    : ''
                            }>
                                ${c.course_code} - ${escapeHtml(c.course_name)}
                            </option>`
                    )
                    .join('');


            document.getElementById(
                'sessionModal'
            ).dataset.editMode =
                item ? 'true' : 'false';


            document.getElementById(
                'sessionModal'
            ).dataset.oldCode =
                item?.session_code || '';


            document.getElementById(
                'sessionModal'
            ).style.display = 'flex';
        };


        window.saveSession = async () => {

            const code =
                document.getElementById(
                    'sessionCode'
                ).value.trim();


            const courseCode =
                document.getElementById(
                    'sessionCourseCode'
                ).value.trim();


            const editMode =
                document.getElementById(
                    'sessionModal'
                ).dataset.editMode === 'true';


            const oldCode =
                parseInt(
                    document.getElementById(
                        'sessionModal'
                    ).dataset.oldCode
                );


            const newCodeNum =
                parseInt(code);


            const courseCodeNum =
                parseInt(courseCode);


            if (
                !code ||
                !courseCode ||
                isNaN(newCodeNum) ||
                isNaN(courseCodeNum)
            ) {

                showToast(
                    '❌ الرجاء إدخال كود الجلسة واختيار الكورس',
                    true
                );

                return;
            }


            const data = {

                id: String(newCodeNum),

                session_code: newCodeNum,

                course_code: courseCodeNum,

                trainer_name:
                    document.getElementById(
                        'trainerName'
                    ).value.trim(),

                session_date:
                    document.getElementById(
                        'sessionDate'
                    ).value,

                start_time:
                    document.getElementById(
                        'sessionStartTime'
                    ).value,

                end_time:
                    document.getElementById(
                        'sessionEndTime'
                    ).value,

                location:
                    document.getElementById(
                        'sessionLocation'
                    ).value.trim(),

                max_capacity:
                    Number(
                        document.getElementById(
                            'sessionMaxCapacity'
                        ).value
                    ) || null,

                status:
                    document.getElementById(
                        'sessionStatus'
                    ).value,

                notes:
                    document.getElementById(
                        'sessionNotes'
                    ).value.trim()
            };


            if (editMode) {

                if (
                    newCodeNum !== oldCode &&
                    isCodeExists(newCodeNum)
                ) {

                    showToast(
                        `❌ الكود ${newCodeNum} مستخدم بالفعل!`,
                        true
                    );

                    return;
                }


                if (newCodeNum !== oldCode) {

                    await DB.delete(
                        'offjob_sessions',
                        String(oldCode)
                    );

                    await DB.insert(
                        'offjob_sessions',
                        data
                    );

                } else {

                    await DB.update(
                        'offjob_sessions',
                        data
                    );
                }


                const index =
                    sessions.findIndex(
                        s =>
                            parseInt(s.session_code) ===
                            oldCode
                    );


                if (index !== -1) {
                    sessions[index] = data;
                }


                showToast('✅ تم تحديث الجلسة');

            } else {

                if (isCodeExists(newCodeNum)) {

                    showToast(
                        `❌ الكود ${newCodeNum} مستخدم بالفعل!`,
                        true
                    );

                    return;
                }


                await DB.insert(
                    'offjob_sessions',
                    data
                );

                sessions.push(data);

                showToast('✅ تم إضافة الجلسة');
            }


            renderUI();

            window.closeModal('sessionModal');
        };
