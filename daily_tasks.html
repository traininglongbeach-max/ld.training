<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    
    <!-- ⛔⛔⛔ منع الكاش نهائياً في هذه الصفحة فقط ⛔⛔⛔ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Daily Tasks Report - نظام إدارة المهام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ============================================================
           RESET & BASE
        ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        :root {
            --primary: #013376;
            --primary-dark: #012A5F;
            --primary-light: #4A7BB5;
            --secondary: #00CEC9;
            --success: #00B894;
            --warning: #FDCB6E;
            --danger: #E17055;
            --dark: #2D3436;
            --gray: #636E72;
            --light-gray: #DFE6DF;
            --white: #FFFFFF;
            --shadow: 0 10px 40px rgba(1, 51, 118, 0.15);
            --shadow-hover: 0 15px 50px rgba(1, 51, 118, 0.25);
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: #F0F2F5;
            color: var(--dark);
            min-height: 100vh;
        }

        body.modal-open {
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--light-gray);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* ============================================================
           NAVBAR
        ============================================================ */
        .navbar {
            background: var(--white);
            padding: 12px 30px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--primary);
            flex-wrap: wrap;
            gap: 10px;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar .logo i {
            font-size: 1.8rem;
            background: var(--primary);
            padding: 10px;
            border-radius: 14px;
            color: white;
        }

        .navbar .logo h1 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .navbar .logo span {
            font-size: 0.7rem;
            color: var(--gray);
            display: block;
            font-weight: 400;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-actions .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #EEF2F7;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.85rem;
        }

        .nav-actions .user-badge i {
            font-size: 1rem;
        }

        .btn-nav {
            padding: 8px 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .btn-nav:hover {
            transform: translateY(-2px);
        }

        .btn-home {
            background: var(--primary);
            color: white;
        }

        .btn-home:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 15px rgba(1, 51, 118, 0.3);
        }

        .btn-logout {
            background: var(--danger);
            color: white;
        }

        .btn-logout:hover {
            background: #d63031;
        }

        .btn-refresh {
            background: var(--success);
            color: white;
        }

        .btn-refresh:hover {
            background: #00a381;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        /* ============================================================
           LAYOUT
        ============================================================ */
        .app-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 25px;
        }

        /* ============================================================
           DASHBOARD SECTION
        ============================================================ */
        .dashboard-section {
            margin-bottom: 35px;
        }

        .dashboard-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dashboard-section .section-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
        }

        .dashboard-section .section-header h2 i {
            color: var(--primary);
            margin-left: 10px;
        }

        .dashboard-section .section-header p {
            color: var(--gray);
            font-size: 0.9rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--white);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(1, 51, 118, 0.06);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .stat-icon {
            width: 50px;
            height: 50px;
            min-width: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .stat-card .stat-icon.purple {
            background: #EEF2F7;
            color: var(--primary);
        }
        .stat-card .stat-icon.green {
            background: #E8F8F5;
            color: var(--success);
        }
        .stat-card .stat-icon.orange {
            background: #FEF9E7;
            color: #F39C12;
        }
        .stat-card .stat-icon.red {
            background: #FDEDEC;
            color: var(--danger);
        }
        .stat-card .stat-icon.blue {
            background: #EBF5FB;
            color: #3498DB;
        }

        .stat-card .stat-info {
            flex: 1;
        }

        .stat-card .stat-info .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--dark);
            line-height: 1.2;
        }

        .stat-card .stat-info .stat-label {
            color: var(--gray);
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* ============================================================
           PERFORMANCE SECTION
        ============================================================ */
        .performance-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(1, 51, 118, 0.06);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #EEF2F7;
        }

        .card .card-header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--dark);
        }

        .card .card-header h3 i {
            color: var(--primary);
            margin-left: 8px;
        }

        .card .card-header .badge-count {
            background: #EEF2F7;
            color: var(--primary);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .performance-row {
            margin-bottom: 14px;
        }

        .performance-row:last-child {
            margin-bottom: 0;
        }

        .performance-row .perf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .performance-row .perf-header .perf-name {
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .performance-row .perf-header .perf-name .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .performance-row .perf-header .perf-value {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.8rem;
        }

        .performance-row .progress-track {
            width: 100%;
            height: 6px;
            background: #EEF2F7;
            border-radius: 10px;
            overflow: hidden;
        }

        .performance-row .progress-track .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 10px;
            transition: width 0.8s ease;
        }

        /* ============================================================
           TASK MANAGEMENT SECTION
        ============================================================ */
        .tasks-section {
            margin-top: 10px;
        }

        .tasks-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tasks-section .section-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
        }

        .tasks-section .section-header h2 i {
            color: var(--primary);
            margin-left: 10px;
        }

        .tasks-section .section-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 15px rgba(1, 51, 118, 0.3);
        }

        .btn-secondary {
            background: #EEF2F7;
            color: var(--primary);
        }

        .btn-secondary:hover {
            background: #E0E6ED;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            box-shadow: 0 4px 15px rgba(225, 112, 85, 0.3);
        }

        .btn-warning {
            background: var(--warning);
            color: var(--dark);
        }

        .btn-warning:hover {
            box-shadow: 0 4px 15px rgba(253, 203, 110, 0.3);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 8px;
        }

        /* ============================================================
           DATE CONTROL
        ============================================================ */
        .date-control {
            background: var(--white);
            border-radius: var(--radius);
            padding: 15px 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(1, 51, 118, 0.06);
        }

        .date-control .date-display {
            flex: 1;
            min-width: 130px;
        }

        .date-control .date-display .date-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .date-control .date-display .date-value {
            font-size: 1rem;
            font-weight: 800;
            color: var(--dark);
        }

        .date-control .date-input {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .date-control .date-input input[type="date"] {
            padding: 8px 14px;
            border: 2px solid var(--light-gray);
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            background: #FAFAFA;
            font-family: inherit;
        }

        .date-control .date-input input[type="date"]:focus {
            border-color: var(--primary);
            background: white;
        }

        .date-control .date-actions {
            display: flex;
            gap: 6px;
        }

        /* ============================================================
           TASK LIST
        ============================================================ */
        .task-list-container {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(1, 51, 118, 0.06);
        }

        .task-section-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #EEF2F7;
            flex-wrap: wrap;
            gap: 8px;
        }

        .task-section-toggle .toggle-title {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-section-toggle .toggle-title .count-badge {
            background: #EEF2F7;
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .task-list-header {
            display: grid;
            grid-template-columns: 2.5fr 1.5fr 1fr 1fr auto;
            gap: 12px;
            padding: 10px 12px;
            background: #F5F6FA;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--gray);
            margin-bottom: 12px;
        }

        .task-item {
            display: grid;
            grid-template-columns: 2.5fr 1.5fr 1fr 1fr auto;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: #FAFAFA;
            border: 1px solid transparent;
            transition: var(--transition);
            align-items: center;
        }

        .task-item:hover {
            background: #F5F6FA;
            border-color: var(--primary-light);
        }

        .task-item.done {
            border-right: 4px solid var(--success);
            background: #F6FFF9;
        }

        .task-item.pending {
            border-right: 4px solid var(--warning);
        }

        .task-item .task-name {
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .task-item .task-name .status-icon {
            font-size: 0.9rem;
        }

        .task-item .task-desc {
            font-size: 0.75rem;
            color: var(--gray);
            margin-top: 3px;
        }

        .task-item .task-people {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .task-item .task-people .person-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            background: #EEF2F7;
            color: var(--primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .task-item .task-people .person-tag:hover {
            background: var(--primary);
            color: white;
        }

        .task-item .task-people .person-tag.done {
            background: #E8F8F5;
            color: var(--success);
        }

        .task-item .task-people .person-tag.done:hover {
            background: var(--success);
            color: white;
        }

        .task-item .task-people .person-tag.on-vacation {
            background: #FDEDEC;
            color: var(--danger);
            opacity: 0.6;
            cursor: not-allowed;
        }

        .task-item .task-people .person-tag.on-vacation:hover {
            background: #FDEDEC;
            color: var(--danger);
        }

        .task-item .task-meta {
            font-size: 0.7rem;
            color: var(--gray);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .task-item .task-meta .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
        }

        .badge-daily {
            background: #EBF5FB;
            color: #3498DB;
        }
        .badge-weekly {
            background: #EEF2F7;
            color: var(--primary);
        }
        .badge-monthly {
            background: #FEF9E7;
            color: #F39C12;
        }
        .badge-once {
            background: var(--light-gray);
            color: var(--gray);
        }

        .task-item .task-actions {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }

        .task-item .task-actions button {
            border: none;
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: var(--transition);
            min-width: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .task-item .task-actions button:hover {
            transform: scale(1.1);
        }

        .btn-complete {
            background: var(--success);
            color: white;
        }

        .btn-uncomplete {
            background: var(--gray);
            color: white;
        }

        .btn-edit {
            background: var(--warning);
            color: var(--dark);
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .btn-delete:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ============================================================
           EMPTY STATE
        ============================================================ */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--light-gray);
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 0.85rem;
        }

        /* ============================================================
           COMPLETED TASKS
        ============================================================ */
        .completed-tasks-wrapper {
            margin-top: 20px;
            border-top: 2px dashed var(--light-gray);
            padding-top: 18px;
        }

        .completed-tasks-wrapper .completed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #F5F6FA;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 12px;
        }

        .completed-tasks-wrapper .completed-header:hover {
            background: #EEF2F7;
        }

        .completed-tasks-wrapper .completed-header .completed-title {
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .completed-tasks-wrapper .completed-header .completed-title .completed-count {
            background: var(--success);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .completed-tasks-wrapper .completed-header .toggle-icon {
            transition: var(--transition);
        }

        .completed-tasks-wrapper .completed-header .toggle-icon.open {
            transform: rotate(180deg);
        }

        .completed-tasks-wrapper .completed-list {
            display: none;
        }

        .completed-tasks-wrapper .completed-list.open {
            display: block;
        }

        .completed-tasks-wrapper .task-item {
            opacity: 0.7;
        }

        .completed-tasks-wrapper .task-item:hover {
            opacity: 1;
        }

        /* ============================================================
           MODAL
        ============================================================ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 15px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--white);
            width: 100%;
            max-width: 550px;
            max-height: calc(100vh - 30px);
            overflow-y: auto;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
            animation: modalSlide .3s ease;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #EEF2F7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-title i {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--gray);
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--light-gray);
            border-radius: 10px;
            font-size: 0.85rem;
            transition: var(--transition);
            background: #FAFAFA;
            font-family: inherit;
            color: var(--dark);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: white;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group .people-selector {
            border: 2px solid var(--light-gray);
            border-radius: 10px;
            padding: 8px;
            max-height: 150px;
            overflow-y: auto;
            background: #FAFAFA;
        }

        .form-group .people-selector .person-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .form-group .people-selector .person-option:hover {
            background: #EEF2F7;
        }

        .form-group .people-selector .person-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .form-group .people-selector .person-option .vacation-badge {
            font-size: 0.55rem;
            color: var(--danger);
            background: #FDEDEC;
            padding: 0 6px;
            border-radius: 10px;
            margin-right: auto;
        }

        .form-group .selected-count {
            margin-top: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 2px solid #EEF2F7;
        }

        .modal-buttons button {
            flex: 1;
        }

        /* ============================================================
           TOAST
        ============================================================ */
        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: white;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 700;
            z-index: 5000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: calc(100vw - 30px);
            text-align: center;
            animation: toastIn .3s ease;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* ============================================================
           LOADING
        ============================================================ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .loading-box {
            background: var(--white);
            padding: 25px 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-hover);
            text-align: center;
            color: var(--primary);
            font-weight: 700;
        }

        .loading-box .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 12px;
            border: 4px solid var(--light-gray);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 1100px) {
            .performance-grid {
                grid-template-columns: 1fr;
            }
            .task-list-header {
                display: none;
            }
            .task-item {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .task-item .task-actions {
                justify-content: flex-start;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 10px;
                padding: 12px 16px;
            }
            .nav-actions {
                width: 100%;
                justify-content: center;
            }
            .app-container {
                padding: 12px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .date-control {
                flex-direction: column;
                align-items: stretch;
            }
            .date-control .date-input {
                flex-direction: column;
            }
            .date-control .date-actions {
                justify-content: center;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .tasks-section .section-header {
                flex-direction: column;
                align-items: stretch;
            }
            .tasks-section .section-actions {
                justify-content: stretch;
            }
            .tasks-section .section-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .modal-content {
                padding: 18px;
            }
            .task-section-toggle {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .task-item .task-actions {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .stat-card {
                padding: 15px;
            }
            .stat-card .stat-info .stat-number {
                font-size: 1.3rem;
            }
            .task-item {
                padding: 10px;
            }
            .nav-actions .user-badge span {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div id="app">
        <div style="text-align:center;padding:150px 20px;color:var(--primary);font-size:1.2rem;">
            <div style="display:inline-block;width:50px;height:50px;border:4px solid #DFE6DF;border-top-color:#013376;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:15px;"></div>
            <div>⏳ جاري تحميل البيانات من Firebase...</div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <div>جاري الحفظ...</div>
        </div>
    </div>

    <script type="module">
        import { auth, DB } from './database.js';
        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        /* ============================================================
           🔥 تعطيل الكاش في هذه الصفحة فقط
           ============================================================ */
        // مسح أي بيانات مخزنة مؤقتاً خاصة بهذه الصفحة
        try {
            // مسح LocalStorage للمجموعات المستخدمة في هذه الصفحة
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.includes('daily_task') || key.includes('firestore'))) {
                    keysToRemove.push(key);
                }
            }
            keysToRemove.forEach(key => {
                localStorage.removeItem(key);
                console.log(`🗑️ تم حذف الكاش: ${key}`);
            });
        } catch (e) {
            console.warn('⚠️ لا يمكن مسح الكاش:', e);
        }

        /* ============================================================
           GLOBAL VARIABLES
        ============================================================ */
        let people = [];
        let taskTemplates = [];
        let taskRecords = [];
        let selectedDate = getToday();
        let currentUser = null;
        let isAdmin = false;
        let showCompleted = false;
        let dataLoaded = false;

        /* ============================================================
           HELPERS
        ============================================================ */
        function getToday() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatDate(date) {
            if (!date) return '-';
            return new Date(date + 'T00:00:00').toLocaleDateString('ar-EG', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(value);
            return div.innerHTML;
        }

        function generateId(prefix = 'task') {
            return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 10)}`;
        }

        function showToast(message, type = 'success') {
            document.querySelector('.toast')?.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast?.remove(), 3000);
        }

        function setLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (!overlay) return;
            overlay.style.display = show ? 'flex' : 'none';
        }

        function getPersonName(personId) {
            const person = people.find(p => String(p.id) === String(personId));
            return person ? person.name : 'غير محدد';
        }

        function getPersonInitials(name) {
            if (!name) return '?';
            return name.charAt(0).toUpperCase();
        }

        function isPersonOnVacation(personId) {
            const person = people.find(p => String(p.id) === String(personId));
            return person ? person.onVacation === true : false;
        }

        function getRecurrenceName(type) {
            const names = { daily: 'يومية', weekly: 'أسبوعية', monthly: 'شهرية', once: 'مرة واحدة' };
            return names[type] || type;
        }

        function getRecurrenceBadge(type) {
            const classes = { daily: 'badge-daily', weekly: 'badge-weekly', monthly: 'badge-monthly', once: 'badge-once' };
            return `<span class="badge ${classes[type] || 'badge-once'}">${getRecurrenceName(type)}</span>`;
        }

        /* ============================================================
           NORMALIZE DATA
        ============================================================ */
        function normalizePersonIds(item) {
            if (Array.isArray(item.person_ids)) return item.person_ids.map(String);
            if (item.person_id !== null && item.person_id !== undefined && item.person_id !== '') return [String(item
                    .person_id)];
            return [];
        }

        function normalizeCompletedPeopleIds(record) {
            if (Array.isArray(record.completed_people_ids)) return record.completed_people_ids.map(String);
            if (record.status === 'completed' && record.person_id) return [String(record.person_id)];
            return [];
        }

        function isPersonCompleted(record, personId) {
            return normalizeCompletedPeopleIds(record).includes(String(personId));
        }

        function getActivePeopleForTask(record) {
            const assigned = normalizePersonIds(record);
            return assigned.filter(id => !isPersonOnVacation(id));
        }

        function isRecordFullyCompleted(record) {
            const activePeople = getActivePeopleForTask(record);
            const completed = normalizeCompletedPeopleIds(record);
            if (activePeople.length === 0) return true;
            return activePeople.every(id => completed.includes(String(id)));
        }

        function getTaskCompletionStatus(record) {
            const assigned = normalizePersonIds(record);
            const completed = normalizeCompletedPeopleIds(record);
            const active = assigned.filter(id => !isPersonOnVacation(id));
            const onVacation = assigned.filter(id => isPersonOnVacation(id));

            return {
                total: assigned.length,
                active: active.length,
                completed: completed.filter(id => active.includes(id)).length,
                onVacation: onVacation.length,
                isComplete: isRecordFullyCompleted(record),
                isPartial: active.length > 0 && completed.some(id => active.includes(id)) && !isRecordFullyCompleted(record)
            };
        }

        /* ============================================================
           PEOPLE SELECTOR
        ============================================================ */
        function renderPeopleSelector(selectedIds = []) {
            const container = document.getElementById('peopleSelector');
            if (!container) return;

            const search = document.getElementById('peopleSearch');
            const searchValue = search ? search.value.trim().toLowerCase() : '';
            const activePeople = people.filter(p =>
                p.active !== false &&
                (!searchValue || String(p.name).toLowerCase().includes(searchValue))
            );

            if (activePeople.length === 0) {
                container.innerHTML = `<div style="padding:15px;text-align:center;color:#a0aec0;">لا يوجد أشخاص</div>`;
                updateSelectedCount();
                return;
            }

            container.innerHTML = activePeople.map(person => {
                const checked = selectedIds.map(String).includes(String(person.id));
                const onVacation = isPersonOnVacation(person.id);
                return `
                    <label class="person-option" style="${onVacation ? 'opacity:0.5;' : ''}">
                        <input type="checkbox" class="person-checkbox" value="${escapeHtml(person.id)}" ${checked ? 'checked' : ''} ${onVacation ? 'disabled' : ''}>
                        <span>${escapeHtml(person.name)}</span>
                        ${onVacation ? '<span class="vacation-badge">📅 في إجازة</span>' : ''}
                    </label>
                `;
            }).join('');

            container.querySelectorAll('.person-checkbox:not([disabled])').forEach(checkbox => {
                checkbox.addEventListener('change', updateSelectedCount);
            });

            updateSelectedCount();
        }

        function getSelectedPersonIds() {
            return Array.from(document.querySelectorAll('.person-checkbox:checked:not([disabled])'))
                .map(checkbox => String(checkbox.value));
        }

        function updateSelectedCount() {
            const count = document.querySelectorAll('.person-checkbox:checked:not([disabled])').length;
            const element = document.getElementById('selectedPeopleCount');
            if (element) element.textContent = `تم اختيار ${count} شخص`;
        }

        window.filterPeople = function() {
            renderPeopleSelector(getSelectedPersonIds());
        };

        function updatePeopleSelects() {
            const selfPerson = document.getElementById('selfPerson');
            if (!selfPerson) return;

            const currentValue = selfPerson.value;
            selfPerson.innerHTML = `
                <option value="">-- اختر اسمك --</option>
                ${people.filter(p => p.active !== false).map(p => `
                    <option value="${escapeHtml(p.id)}">${escapeHtml(p.name)} ${isPersonOnVacation(p.id) ? '(في إجازة)' : ''}</option>
                `).join('')}
            `;
            if (currentValue && people.some(p => String(p.id) === String(currentValue))) {
                selfPerson.value = currentValue;
            }
        }

        /* ============================================================
           TOGGLE VACATION - 🔥 حفظ في Firebase
        ============================================================ */
        window.toggleVacation = async function(personId) {
            const person = people.find(p => String(p.id) === String(personId));
            if (!person) {
                showToast('❌ لم يتم العثور على الشخص', 'error');
                return;
            }

            setLoading(true);

            try {
                const newVacationStatus = !person.onVacation;

                const updatedPerson = {
                    ...person,
                    onVacation: newVacationStatus,
                    updated_at: new Date().toISOString()
                };

                await DB.update('daily_task_people', updatedPerson);

                const index = people.findIndex(p => String(p.id) === String(personId));
                if (index !== -1) {
                    people[index] = updatedPerson;
                }

                const message = newVacationStatus ?
                    `📅 تم تسجيل إجازة ${person.name} وحفظها في Firebase` :
                    `✅ تم إلغاء إجازة ${person.name} وحفظها في Firebase`;

                showToast(message, 'success');

                render();
                renderPeopleManager();
                updatePeopleSelects();

            } catch (error) {
                console.error('❌ فشل تحديث حالة الإجازة:', error);
                showToast('❌ فشل حفظ حالة الإجازة في Firebase', 'error');
            } finally {
                setLoading(false);
            }
        };

        /* ============================================================
           DATE LOGIC
        ============================================================ */
        function isTaskDue(template, date) {
            if (!template.start_date) return false;
            if (date < template.start_date) return false;
            if (template.end_date && date > template.end_date) return false;

            if (template.recurrence === 'once') return date === template.start_date;

            const target = new Date(template.start_date + 'T00:00:00');
            const current = new Date(date + 'T00:00:00');
            const diff = Math.floor((current - target) / (1000 * 60 * 60 * 24));

            if (template.recurrence === 'daily') return diff >= 0;
            if (template.recurrence === 'weekly') return diff >= 0 && diff % 7 === 0;
            if (template.recurrence === 'monthly') return target.getDate() === current.getDate();
            return false;
        }

        /* ============================================================
           🔥 LOAD DATA - قراءة مباشرة من Firebase (بدون كاش)
        ============================================================ */
        async function loadData() {
            await DB.init();

            try {
                // 🔥 استخدام cache: false في جميع القراءات
                const peopleResult = await DB.getAll('daily_task_people', { cache: false });
                const templatesResult = await DB.getAll('daily_task_templates', { cache: false });
                const recordsResult = await DB.getAll('daily_task_records', { cache: false });

                people = peopleResult || [];
                taskTemplates = templatesResult || [];
                taskRecords = recordsResult || [];

                console.log('✅ تم تحميل البيانات من Firebase (بدون كاش):', {
                    people: people.length,
                    templates: taskTemplates.length,
                    records: taskRecords.length
                });

            } catch (error) {
                console.error('❌ فشل تحميل البيانات من Firebase:', error);
                // محاولة مرة أخرى بدون cache
                try {
                    const peopleResult = await DB.getAll('daily_task_people');
                    const templatesResult = await DB.getAll('daily_task_templates');
                    const recordsResult = await DB.getAll('daily_task_records');

                    people = peopleResult || [];
                    taskTemplates = templatesResult || [];
                    taskRecords = recordsResult || [];
                } catch (error2) {
                    console.error('❌ فشل المحاولة الثانية:', error2);
                    people = [];
                    taskTemplates = [];
                    taskRecords = [];
                }
            }

            // تطبيع البيانات
            taskTemplates = taskTemplates.map(template => ({
                ...template,
                person_ids: normalizePersonIds(template)
            }));

            taskRecords = taskRecords.map(record => {
                const personIds = normalizePersonIds(record);
                const completedIds = normalizeCompletedPeopleIds(record);
                return {
                    ...record,
                    person_ids: personIds,
                    completed_people_ids: completedIds,
                    status: isRecordFullyCompleted({ ...record, person_ids: personIds, completed_people_ids: completedIds }) ?
                        'completed' : 'pending'
                };
            });

            // إنشاء أشخاص افتراضيين إذا لم يوجد
            if (people.length === 0) {
                const defaultPeople = ['مينا', 'يوانا', 'دينا', 'محمد'];
                for (const name of defaultPeople) {
                    const person = {
                        id: generateId('person'),
                        name,
                        active: true,
                        onVacation: false,
                        created_at: new Date().toISOString()
                    };
                    await DB.insert('daily_task_people', person);
                    people.push(person);
                }
            }

            await generateRecordsForDate(selectedDate);
            dataLoaded = true;
            render();
            updatePeopleSelects();
        }

        /* ============================================================
           🔥 REFRESH DATA - تحديث يدوي من Firebase
        ============================================================ */
        window.refreshData = async function() {
            setLoading(true);
            try {
                // 🔥 إعادة تحميل البيانات من Firebase (بدون كاش)
                const peopleResult = await DB.getAll('daily_task_people', { cache: false });
                const templatesResult = await DB.getAll('daily_task_templates', { cache: false });
                const recordsResult = await DB.getAll('daily_task_records', { cache: false });

                people = peopleResult || [];
                taskTemplates = templatesResult || [];
                taskRecords = recordsResult || [];

                // إعادة التطبيع
                taskTemplates = taskTemplates.map(template => ({
                    ...template,
                    person_ids: normalizePersonIds(template)
                }));

                taskRecords = taskRecords.map(record => {
                    const personIds = normalizePersonIds(record);
                    const completedIds = normalizeCompletedPeopleIds(record);
                    return {
                        ...record,
                        person_ids: personIds,
                        completed_people_ids: completedIds,
                        status: isRecordFullyCompleted({ ...record, person_ids: personIds, completed_people_ids: completedIds }) ?
                            'completed' : 'pending'
                    };
                });

                await generateRecordsForDate(selectedDate);
                render();
                updatePeopleSelects();
                showToast('✅ تم تحديث البيانات من Firebase', 'success');
            } catch (error) {
                console.error('❌ فشل تحديث البيانات:', error);
                showToast('❌ فشل تحديث البيانات من Firebase', 'error');
            } finally {
                setLoading(false);
            }
        };

        /* ============================================================
           GENERATE RECORDS
        ============================================================ */
        async function generateRecordsForDate(date) {
            const dueTemplates = taskTemplates.filter(template =>
                template.active !== false && isTaskDue(template, date)
            );

            for (const template of dueTemplates) {
                const recordId = `daily_${template.id}_${date}`;

                if (taskRecords.some(r => String(r.id) === String(recordId))) continue;

                let existingRecord = null;
                try {
                    existingRecord = await DB.get('daily_task_records', recordId);
                } catch (error) {
                    existingRecord = null;
                }

                if (existingRecord) {
                    const normalized = {
                        ...existingRecord,
                        person_ids: normalizePersonIds(existingRecord),
                        completed_people_ids: normalizeCompletedPeopleIds(existingRecord)
                    };
                    normalized.status = isRecordFullyCompleted(normalized) ? 'completed' : 'pending';
                    taskRecords.push(normalized);
                    continue;
                }

                const personIds = normalizePersonIds(template);
                const newRecord = {
                    id: recordId,
                    template_id: template.id,
                    task_name: template.task_name,
                    description: template.description || '',
                    person_ids: personIds,
                    person_id: personIds.length ? personIds[0] : null,
                    task_date: date,
                    recurrence: template.recurrence,
                    status: 'pending',
                    completed_people_ids: [],
                    completed_at: null,
                    completed_by: null,
                    created_at: new Date().toISOString()
                };

                await DB.insert('daily_task_records', newRecord);
                taskRecords.push(newRecord);
            }
        }

        /* ============================================================
           GET RECORDS
        ============================================================ */
        function getRecordsForDate(date) {
            return taskRecords
                .filter(record => String(record.task_date) === String(date))
                .sort((a, b) => String(a.task_name).localeCompare(String(b.task_name), 'ar'));
        }

        /* ============================================================
           OPEN TASK MODAL
        ============================================================ */
        window.openTaskModal = function(record = null) {
            if (!isAdmin) {
                showToast('❌ فقط الأدمن يمكنه إضافة أو تعديل المهام', 'error');
                return;
            }

            const title = document.getElementById('taskModalTitle');
            const taskId = document.getElementById('taskId');
            const taskName = document.getElementById('taskName');
            const taskDescription = document.getElementById('taskDescription');
            const taskRecurrence = document.getElementById('taskRecurrence');
            const taskStartDate = document.getElementById('taskStartDate');
            const taskEndDate = document.getElementById('taskEndDate');

            if (!title) return;

            title.innerHTML = record ? '✏️ تعديل المهمة' : '➕ إضافة مهمة جديدة';
            taskId.value = record?.id || '';
            taskName.value = record?.task_name || '';
            taskDescription.value = record?.description || '';
            taskRecurrence.value = record?.recurrence || 'once';
            taskStartDate.value = record?.task_date || selectedDate;
            taskEndDate.value = '';

            const personIds = record ? normalizePersonIds(record) : [];
            renderPeopleSelector(personIds);

            document.getElementById('taskModal').style.display = 'flex';
            document.body.classList.add('modal-open');
        };

        /* ============================================================
           SAVE TASK
        ============================================================ */
        window.saveTask = async function() {
            if (!isAdmin) {
                showToast('❌ فقط الأدمن يمكنه إضافة أو تعديل المهام', 'error');
                return;
            }

            const id = document.getElementById('taskId').value;
            const taskName = document.getElementById('taskName').value.trim();
            const description = document.getElementById('taskDescription').value.trim();
            const personIds = getSelectedPersonIds();
            const recurrence = document.getElementById('taskRecurrence').value;
            const startDate = document.getElementById('taskStartDate').value;
            const endDate = document.getElementById('taskEndDate').value;

            if (!taskName) return showToast('❌ اكتب اسم المهمة', 'error');
            if (!startDate) return showToast('❌ اختر تاريخ بداية المهمة', 'error');
            if (personIds.length === 0) return showToast('❌ اختر شخصًا واحدًا على الأقل', 'error');

            const vacationPeople = personIds.filter(id => isPersonOnVacation(id));
            if (vacationPeople.length > 0) {
                const names = vacationPeople.map(id => getPersonName(id)).join(', ');
                return showToast(`❌ لا يمكن إسناد مهمة لأشخاص في إجازة: ${names}`, 'error');
            }

            setLoading(true);

            try {
                const now = new Date().toISOString();

                if (!id) {
                    const template = {
                        id: generateId('template'),
                        task_name: taskName,
                        description: description,
                        person_ids: personIds,
                        person_id: personIds[0] || null,
                        recurrence: recurrence,
                        start_date: startDate,
                        end_date: endDate || null,
                        active: true,
                        created_at: now,
                        updated_at: now
                    };

                    await DB.insert('daily_task_templates', template);
                    taskTemplates.push(template);
                    await generateRecordsForDate(selectedDate);
                    showToast('✅ تم إضافة المهمة وحفظها في Firebase', 'success');
                } else {
                    const oldTemplate = taskTemplates.find(t => String(t.id) === String(id));
                    if (!oldTemplate) return showToast('❌ لم يتم العثور على المهمة', 'error');

                    const updatedTemplate = {
                        ...oldTemplate,
                        task_name: taskName,
                        description: description,
                        person_ids: personIds,
                        person_id: personIds[0] || null,
                        recurrence: recurrence,
                        start_date: startDate,
                        end_date: endDate || null,
                        active: true,
                        updated_at: now
                    };

                    await DB.update('daily_task_templates', updatedTemplate);
                    const templateIndex = taskTemplates.findIndex(t => String(t.id) === String(id));
                    if (templateIndex !== -1) taskTemplates[templateIndex] = updatedTemplate;

                    const relatedRecords = taskRecords.filter(r => String(r.template_id) === String(id));
                    for (const existingRecord of relatedRecords) {
                        const oldCompleted = normalizeCompletedPeopleIds(existingRecord);
                        const validCompleted = oldCompleted.filter(pid => personIds.includes(String(pid)));

                        const updatedRecord = {
                            ...existingRecord,
                            task_name: taskName,
                            description: description,
                            person_ids: personIds,
                            person_id: personIds[0] || null,
                            recurrence: recurrence,
                            completed_people_ids: validCompleted,
                            status: isRecordFullyCompleted({ ...existingRecord, person_ids: personIds,
                                completed_people_ids: validCompleted }) ?
                                'completed' : 'pending',
                            updated_at: now
                        };

                        if (updatedRecord.status === 'completed') {
                            updatedRecord.completed_at = existingRecord.completed_at || now;
                        } else {
                            updatedRecord.completed_at = null;
                        }

                        await DB.update('daily_task_records', updatedRecord);
                        const recordIndex = taskRecords.findIndex(r => String(r.id) === String(existingRecord.id));
                        if (recordIndex !== -1) taskRecords[recordIndex] = updatedRecord;
                    }

                    await generateRecordsForDate(selectedDate);
                    showToast('✅ تم تعديل المهمة وحفظ التعديل في Firebase', 'success');
                }

                closeModal('taskModal');
                render();

            } catch (error) {
                console.error('SAVE TASK ERROR:', error);
                showToast('❌ حدث خطأ أثناء الحفظ: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        };

        /* ============================================================
           TOGGLE PERSON COMPLETION
        ============================================================ */
        window.togglePersonTask = async function(recordId, personId) {
            if (isPersonOnVacation(personId)) {
                showToast('❌ هذا الشخص في إجازة، لا يمكن تغيير حالته', 'error');
                return;
            }

            const taskRecord = taskRecords.find(r => String(r.id) === String(recordId));
            if (!taskRecord) return;

            const assignedIds = normalizePersonIds(taskRecord);
            if (!assignedIds.includes(String(personId))) {
                return showToast('❌ هذا الشخص غير مسند إلى المهمة', 'error');
            }

            let completedIds = normalizeCompletedPeopleIds(taskRecord);
            const normalizedPersonId = String(personId);

            if (completedIds.includes(normalizedPersonId)) {
                completedIds = completedIds.filter(id => String(id) !== normalizedPersonId);
            } else {
                completedIds.push(normalizedPersonId);
            }

            const fullyCompleted = isRecordFullyCompleted({ ...taskRecord, completed_people_ids: completedIds });
            const now = new Date().toISOString();

            const updatedRecord = {
                ...taskRecord,
                person_ids: assignedIds,
                completed_people_ids: completedIds,
                status: fullyCompleted ? 'completed' : 'pending',
                completed_at: fullyCompleted ? now : null,
                completed_by: fullyCompleted ? currentUser?.uid || null : null,
                updated_at: now
            };

            setLoading(true);

            try {
                await DB.update('daily_task_records', updatedRecord);
                const index = taskRecords.findIndex(r => String(r.id) === String(recordId));
                if (index !== -1) taskRecords[index] = updatedRecord;
                render();
            } catch (error) {
                console.error('TOGGLE COMPLETION ERROR:', error);
                showToast('❌ فشل حفظ حالة التنفيذ: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        };

            const now = new Date().toISOString();
            const updatedRecord = {
                ...taskRecord,
                completed_people_ids: [...activePeople],
                status: 'completed',
                completed_at: now,
                completed_by: currentUser?.uid || null,
                updated_at: now
            };

            setLoading(true);

            try {
                await DB.update('daily_task_records', updatedRecord);
                const index = taskRecords.findIndex(r => String(r.id) === String(recordId));
                if (index !== -1) taskRecords[index] = updatedRecord;
                showToast('✅ تم تنفيذ المهمة لجميع الأشخاص النشطين', 'success');

            } catch (error) {
                console.error(error);

        /* ============================================================
           DELETE TASK
        ============================================================ */
        window.deleteTask = async function(recordId) {
            if (!isAdmin) {
                showToast('❌ فقط الأدمن يمكنه حذف المهام', 'error');
                return;
            }

            const taskRecord = taskRecords.find(r => String(r.id) === String(recordId));
            if (!taskRecord) return;

            const templateId = taskRecord.template_id;
            const confirmation = confirm(
                '⚠️ هل أنت متأكد من حذف هذه المهمة؟\n\n' +
                'سيتم حذف المهمة من Firebase ولن يتم توليدها مرة أخرى.'
            );
            if (!confirmation) return;

            setLoading(true);

            try {
                if (templateId) {
                    const template = taskTemplates.find(t => String(t.id) === String(templateId));
                    if (template) {
                        await DB.delete('daily_task_templates', template.id);
                        taskTemplates = taskTemplates.filter(t => String(t.id) !== String(template.id));
                    }
                }

                const relatedRecords = taskRecords.filter(r =>
                    (templateId && String(r.template_id) === String(templateId)) ||
                    String(r.id) === String(recordId)
                );

                for (const relatedRecord of relatedRecords) {
                    await DB.delete('daily_task_records', relatedRecord.id);
                }

                taskRecords = taskRecords.filter(r =>
                    !relatedRecords.some(deleted => String(deleted.id) === String(r.id))
                );

                showToast('🗑️ تم حذف المهمة من Firebase', 'success');
                render();

            } catch (error) {
                console.error('DELETE TASK ERROR:', error);
                showToast('❌ فشل حذف المهمة: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        };

        function renderAssigneesForTask(record) {
            const personIds = normalizePersonIds(record);
            const completedIds = normalizeCompletedPeopleIds(record);

            if (personIds.length === 0) {
                return `<span style="color:var(--gray);font-size:0.7rem;">لا يوجد</span>`;
            }

            return personIds.map(personId => {
                const completed = completedIds.includes(String(personId));
                const onVacation = isPersonOnVacation(personId);
                const name = getPersonName(personId);

                let statusText = '';
                let className = 'person-tag';
                let onClickAction = `togglePersonTask('${escapeHtml(record.id)}', '${escapeHtml(personId)}')`;

                if (onVacation) {
                    className += ' on-vacation';
                    statusText = '📅 إجازة';
                    onClickAction = '';
                } else if (completed) {
                    className += ' done';
                    statusText = '✅';
                } else {
                    statusText = '⏳';
                }

                return `
                    <span class="${className}" 
                          ${onClickAction ? `onclick="${onClickAction}"` : ''}
                          title="${onVacation ? 'في إجازة - لا يمكن التغيير' : completed ? '✅ تم التنفيذ - اضغط للإلغاء' : '⏳ لم يتم التنفيذ - اضغط للتنفيذ'}">
                        ${statusText} ${escapeHtml(name)}
                    </span>
                `;
            }).join('');
        }
