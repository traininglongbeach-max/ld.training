                            <div class="card-header">
                                <h3><i class="fas fa-chart-bar"></i> أداء الأشخاص</h3>
                                <span class="badge-count">${peopleStats.length} نشط</span>
                            </div>
                            ${peopleStats.length === 0 ? `
                                <div class="empty-state">
                                    <i class="fas fa-user-slash"></i>
                                    <h3>لا توجد بيانات أداء</h3>
                                    <p>لم يتم تعيين مهام لأي شخص في هذا اليوم</p>
                                </div>
                            ` : peopleStats.map(person => `
                                <div class="performance-row">
                                    <div class="perf-header">
                                        <span class="perf-name">
                                            <span class="avatar">${getPersonInitials(person.name)}</span>
                                            ${escapeHtml(person.name)}
                                            ${isPersonOnVacation(person.id) ? ' 📅' : ''}
                                        </span>
                                        <span class="perf-value">${person.done}/${person.total} (${person.percentage}%)</span>
                                    </div>
                                    <div class="progress-track">
                                        <div class="progress-fill" style="width:${person.percentage}%;"></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-bolt"></i> ملخص سريع</h3>
                            </div>
                            <div style="display:grid;gap:10px;">
                                <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#F5F6FA;border-radius:10px;">
                                    <span style="font-weight:600;font-size:0.85rem;">📊 نسبة الإنجاز</span>
                                    <span style="font-weight:800;color:var(--primary);font-size:0.9rem;">${completionPercentage}%</span>
                                </div>
                                <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#F5F6FA;border-radius:10px;">
                                    <span style="font-weight:600;font-size:0.85rem;">✅ المهام المكتملة</span>
                                    <span style="font-weight:800;color:var(--success);font-size:0.9rem;">${completed}</span>
                                </div>
                                <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#F5F6FA;border-radius:10px;">
                                    <span style="font-weight:600;font-size:0.85rem;">⏳ المهام المتبقية</span>
                                    <span style="font-weight:800;color:var(--warning);font-size:0.9rem;">${pending}</span>
                                </div>
                                <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#F5F6FA;border-radius:10px;">
                                    <span style="font-weight:600;font-size:0.85rem;">📋 عدد القوالب</span>
                                    <span style="font-weight:800;color:var(--primary);font-size:0.9rem;">${taskTemplates.length}</span>
                                </div>
                                ${vacationPeople.length > 0 ? `
                                <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#FDEDEC;border-radius:10px;border:1px solid var(--danger);">
                                    <span style="font-weight:600;font-size:0.85rem;">📅 في إجازة</span>
                                    <span style="font-weight:800;color:var(--danger);font-size:0.9rem;">${vacationPeople.length} شخص</span>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </section>

                <!-- ==================================================
                     TASK MANAGEMENT SECTION
                ================================================== -->
                <section class="tasks-section">
                    <div class="section-header">
                        <div>
                            <h2><i class="fas fa-list-check"></i> إدارة المهام</h2>
                            <p>عرض وإدارة جميع المهام لهذا اليوم</p>
                        </div>
                        <div class="section-actions">
                            ${isAdmin ? `
                                <button class="btn btn-primary" onclick="openTaskModal()">
                                    <i class="fas fa-plus"></i> إضافة مهمة
                                </button>
                            ` : ''}
                            <button class="btn btn-secondary" onclick="openSelfTaskModal()">
                                <i class="fas fa-user-check"></i> تسجيل مهمة باسمي
                            </button>
                            <button class="btn btn-secondary" onclick="openPeopleModal()">
                                <i class="fas fa-users-cog"></i> إدارة الأشخاص
                            </button>
                        </div>
                    </div>

                    <!-- Date Control -->
                    <div class="date-control">
                        <div class="date-display">
                            <div class="date-label">التاريخ المحدد</div>
                            <div class="date-value">${formatDate(selectedDate)}</div>
                        </div>
                        <div class="date-input">
                            <input type="date" value="${selectedDate}" onchange="changeDate(this.value)">
                            <button class="btn btn-primary btn-sm" onclick="goToday()">📅 اليوم</button>
                            <button class="btn btn-secondary btn-sm" onclick="goYesterday()">⬅️ أمس</button>
                        </div>
                        <div class="date-actions">
                            <button class="btn btn-secondary btn-sm" onclick="render()"><i class="fas fa-sync"></i> إعادة تحميل</button>
                        </div>
                    </div>

                    <!-- Pending Tasks -->
                    <div class="task-list-container">
                        <div class="task-section-toggle">
                            <div class="toggle-title">
                                <i class="fas fa-clock" style="color:var(--warning);"></i>
                                المهام قيد التنفيذ
                                <span class="count-badge">${pending}</span>
                            </div>
                            <div style="display:flex;gap:8px;align-items:center;">
                                <span style="font-size:0.7rem;color:var(--gray);">
                                    <i class="fas fa-info-circle"></i> الأشخاص في إجازة لا يحتسبون
                                </span>
                            </div>
                        </div>

                        ${pendingRecords.length === 0 ? `
                            <div class="empty-state" style="padding:25px 20px;">
                                <i class="fas fa-check-circle" style="color:var(--success);"></i>
                                <h3>🎉 جميع المهام مكتملة!</h3>
                                <p>لا توجد مهام قيد التنفيذ لهذا اليوم</p>
                            </div>
                        ` : `
                            <div class="task-list-header">
                                <span>المهمة</span>
                                <span>الأشخاص المسندون</span>
                                <span>التكرار</span>
                                <span>الحالة</span>
                                <span style="text-align:left;">الإجراءات</span>
                            </div>
                            ${pendingRecords.map(taskRecord => {
                                const fullyCompleted = isRecordFullyCompleted(taskRecord);
                                const status = getTaskCompletionStatus(taskRecord);

                                return `
                                    <div class="task-item pending">
                                        <div class="task-name">
                                            <span class="status-icon">⏳</span>
                                            <div>
                                                ${escapeHtml(taskRecord.task_name)}
                                                ${taskRecord.description ? `<div class="task-desc">📝 ${escapeHtml(taskRecord.description)}</div>` : ''}
                                                ${status.onVacation > 0 ? `<div class="task-desc" style="color:var(--danger);">📅 ${status.onVacation} شخص في إجازة</div>` : ''}
                                            </div>
                                        </div>
                                        <div class="task-people">
                                            ${renderAssigneesForTask(taskRecord)}
                                        </div>
                                        <div class="task-meta">
                                            ${getRecurrenceBadge(taskRecord.recurrence)}
                                        </div>
                                        <div class="task-meta">
                                            <span style="font-weight:700;font-size:0.75rem;">
                                                ${status.active > 0 ? `✅ ${status.completed}/${status.active} نشط` : '👤 لا يوجد نشط'}
                                                ${status.onVacation > 0 ? ` 📅 ${status.onVacation} إجازة` : ''}
                                            </span>
                                        </div>
                                        <div class="task-actions">
                                            ${!fullyCompleted && status.active > 0 ? `
                                                <button class="btn-complete" title="تنفيذ للجميع (النشطين فقط)" onclick="completeTask('${escapeHtml(taskRecord.id)}')">
                                                    <i class="fas fa-check-double"></i>
                                                </button>
                                            ` : ``}
                                            ${isAdmin && taskRecord.template_id ? `
                                                <button class="btn-edit" title="تعديل" onclick="editTemplate('${escapeHtml(taskRecord.template_id)}')">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                            ` : ''}
                                            ${isAdmin ? `
                                                <button class="btn-delete" title="حذف" onclick="deleteTask('${escapeHtml(taskRecord.id)}')">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            ` : `
                                                <button class="btn-delete" disabled title="غير مسموح للحذف">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            `}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        `}
                    </div>

                    <!-- Completed Tasks -->
                    <div class="completed-tasks-wrapper">
                        <div class="completed-header" onclick="toggleCompletedTasks()">
                            <div class="completed-title">
                                <i class="fas fa-check-circle" style="color:var(--success);"></i>
                                المهام المكتملة
                                <span class="completed-count">${completedRecords.length}</span>
                            </div>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span style="font-size:0.7rem;color:var(--gray);">
                                    ${showCompleted ? '🔽 إخفاء' : '▶️ إظهار'}
                                </span>
                                <i class="fas fa-chevron-down toggle-icon ${showCompleted ? 'open' : ''}"></i>
                            </div>
                        </div>

                        <div class="completed-list ${showCompleted ? 'open' : ''}">
                            ${completedRecords.length === 0 ? `
                                <div class="empty-state" style="padding:15px;">
                                    <p style="color:var(--gray);font-size:0.85rem;">لا توجد مهام مكتملة لهذا اليوم</p>
                                </div>
                            ` : `
                                <div class="task-list-header">
                                    <span>المهمة</span>
                                    <span>الأشخاص المسندون</span>
                                    <span>التكرار</span>
                                    <span>وقت الإكمال</span>
                                    <span style="text-align:left;">الإجراءات</span>
                                </div>
                                ${completedRecords.map(taskRecord => {
                                    return `
                                        <div class="task-item done">
                                            <div class="task-name">
                                                <span class="status-icon">✅</span>
                                                <div>
                                                    ${escapeHtml(taskRecord.task_name)}
                                                    ${taskRecord.description ? `<div class="task-desc">📝 ${escapeHtml(taskRecord.description)}</div>` : ''}
                                                </div>
                                            </div>
                                            <div class="task-people">
                                                ${renderAssigneesForTask(taskRecord)}
                                            </div>
                                            <div class="task-meta">
                                                ${getRecurrenceBadge(taskRecord.recurrence)}
                                            </div>
                                            <div class="task-meta">
                                                <span style="font-size:0.65rem;color:var(--success);">
                                                    🕐 ${taskRecord.completed_at ? new Date(taskRecord.completed_at).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) : '—'}
                                                </span>
                                            </div>
                                            <div class="task-actions">
                                                <button class="btn-uncomplete" title="إعادة المهمة" onclick="uncompleteTask('${escapeHtml(taskRecord.id)}')">
                                                    <i class="fas fa-undo"></i>
                                                </button>
                                                ${isAdmin && taskRecord.template_id ? `
                                                    <button class="btn-edit" title="تعديل" onclick="editTemplate('${escapeHtml(taskRecord.template_id)}')">
                                                        <i class="fas fa-edit"></i>
                                                    </button>
                                                ` : ''}
                                                ${isAdmin ? `
                                                    <button class="btn-delete" title="حذف" onclick="deleteTask('${escapeHtml(taskRecord.id)}')">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                ` : `
                                                    <button class="btn-delete" disabled title="غير مسموح للحذف">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                `}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            `}
                        </div>
                    </div>
                </section>
            `;
        };

        /* ============================================================
           LOGOUT
        ============================================================ */
        window.logout = async function() {
            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (error) {
                console.error(error);
            }
        };

        /* ============================================================
           AUTH
        ============================================================ */
        onAuthStateChanged(auth, async user => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = user;

            try {
                await DB.init();

                let userData = null;
                try {
                    userData = await DB.get('users', user.uid);
                } catch (error) {
                    console.error('فشل قراءة بيانات المستخدم:', error);
                }

                isAdmin = userData && (userData.role === 'admin' || userData.role === 'Admin');

                if (!isAdmin) {
                    console.log('👤 مستخدم عادي - صلاحيات محدودة');
                } else {
                    console.log('🛡️ أدمن - صلاحيات كاملة');
                }

                // BUILD PAGE
                document.getElementById('app').innerHTML = `
                    <!-- NAVBAR -->
                    <nav class="navbar">
                        <div class="logo">
                            <i class="fas fa-tasks"></i>
                            <div>
                                <h1>نظام المهام</h1>
                                <span>Daily Tasks Report</span>
                            </div>
                        </div>
                        <div class="nav-actions">
                            <a href="/" class="btn-nav btn-home">
                                <i class="fas fa-home"></i>
                                الرئيسية
                            </a>
                            <button class="btn-nav btn-refresh" onclick="refreshData()">
                                <i class="fas fa-sync"></i>
                                تحديث
                            </button>
                            <div class="user-badge">
                                <i class="fas fa-user-circle"></i>
                                <span>${escapeHtml(userData?.name || 'مستخدم')}</span>
                                ${isAdmin ? '<span style="background:var(--primary);color:white;padding:2px 8px;border-radius:20px;font-size:0.6rem;">أدمن</span>' : ''}
                            </div>
                            <button class="btn-nav btn-logout" onclick="logout()">
                                <i class="fas fa-sign-out-alt"></i>
                                خروج
                            </button>
                        </div>
                    </nav>

                    <!-- CONTENT -->
                    <div class="app-container">
                        <div id="content"></div>
                    </div>

                    <!-- TASK MODAL -->
                    <div id="taskModal" class="modal">
                        <div class="modal-content">
                            <div class="modal-title">
                                <i class="fas fa-plus-circle"></i>
                                <span id="taskModalTitle">إضافة مهمة جديدة</span>
                            </div>
                            <input type="hidden" id="taskId">
                            <div class="form-group">
                                <label>اسم المهمة *</label>
                                <input id="taskName" type="text" placeholder="مثال: مراجعة تقارير التدريب">
                            </div>
                            <div class="form-group">
                                <label>وصف المهمة</label>
                                <textarea id="taskDescription" rows="3" placeholder="تفاصيل المهمة..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>الأشخاص المسؤولون *</label>
                                <input id="peopleSearch" class="people-search" type="text" placeholder="🔍 ابحث عن شخص..." oninput="filterPeople()">
                                <div id="peopleSelector" class="people-selector"></div>
                                <div id="selectedPeopleCount" class="selected-count">تم اختيار 0 شخص</div>
                                <div style="font-size:0.7rem;color:var(--gray);margin-top:4px;">
                                    <i class="fas fa-info-circle"></i> الأشخاص في إجازة غير متاحين للإسناد
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>تكرار المهمة</label>
                                    <select id="taskRecurrence">
                                        <option value="once">مرة واحدة</option>
                                        <option value="daily">يومية</option>
                                        <option value="weekly">أسبوعية</option>
                                        <option value="monthly">شهرية</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>تاريخ البداية *</label>
                                    <input type="date" id="taskStartDate">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>تاريخ النهاية</label>
                                <input type="date" id="taskEndDate">
                            </div>
                            <div class="modal-buttons">
                                <button class="btn btn-primary" onclick="saveTask()"><i class="fas fa-save"></i> حفظ المهمة</button>
                                <button class="btn btn-secondary" onclick="closeModal('taskModal')">إلغاء</button>
                            </div>
                        </div>
                    </div>

                    <!-- SELF TASK MODAL -->
                    <div id="selfTaskModal" class="modal">
                        <div class="modal-content">
                            <div class="modal-title">
                                <i class="fas fa-user-check"></i>
                                تسجيل مهمة باسمي
                            </div>
                            <div class="form-group">
                                <label>اختر اسمك *</label>
                                <select id="selfPerson">
                                    <option value="">-- اختر اسمك --</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>المهمة *</label>
                                <input id="selfTaskName" placeholder="اكتب المهمة التي قمت بها">
                            </div>
                            <div class="form-group">
                                <label>التفاصيل</label>
                                <textarea id="selfTaskDescription" rows="3"></textarea>
                            </div>
                            <div class="modal-buttons">
                                <button class="btn btn-success" onclick="saveSelfTask()"><i class="fas fa-check"></i> تسجيل المهمة</button>
                                <button class="btn btn-secondary" onclick="closeModal('selfTaskModal')">إلغاء</button>
                            </div>
                        </div>
                    </div>

                    <!-- PEOPLE MODAL -->
                    <div id="peopleModal" class="modal">
                        <div class="modal-content">
                            <div class="modal-title">
                                <i class="fas fa-users-cog"></i>
                                إدارة الأشخاص
                            </div>
                            <div style="display:flex;gap:8px;margin-bottom:12px;">
                                <input id="newPersonName" placeholder="اسم الشخص الجديد" style="flex:1;padding:10px 14px;border:2px solid var(--light-gray);border-radius:10px;font-size:0.85rem;">
                                <button class="btn btn-primary" onclick="addPerson()"><i class="fas fa-plus"></i> إضافة</button>
                            </div>
                            <div style="margin-bottom:12px;padding:8px 12px;background:#F5F6FA;border-radius:10px;font-size:0.75rem;color:var(--gray);">
                                <i class="fas fa-info-circle"></i> 
                                اضغط على زر <strong>"إجازة"</strong> لتحديد شخص في إجازة، سيتم حفظها في Firebase
                            </div>
                            <div id="peopleManager"></div>
                            <div class="modal-buttons">
                                <button class="btn btn-secondary" onclick="closeModal('peopleModal')">إغلاق</button>
                            </div>
                        </div>
                    </div>
                `;

                // Set initial date
                const startDateInput = document.getElementById('taskStartDate');
                if (startDateInput) startDateInput.value = selectedDate;

                await loadData();

            } catch (error) {
                console.error(error);
                document.getElementById('app').innerHTML = `
                    <div style="text-align:center;padding:100px 20px;">
                        <div style="font-size:4rem;margin-bottom:15px;">❌</div>
                        <h2 style="color:var(--danger);">حدث خطأ في تحميل البيانات</h2>
                        <p style="margin-top:15px;color:var(--gray);">${escapeHtml(error.message)}</p>
                        <button class="btn btn-primary" style="margin-top:20px;" onclick="location.reload()">🔄 إعادة المحاولة</button>
                    </div>
                `;
            }
        });

        /* ============================================================
           CLOSE MODAL WHEN CLICK OUTSIDE
        ============================================================ */
        document.addEventListener('click', event => {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
                document.body.classList.remove('modal-open');
            }
        });

        /* ============================================================
           ESCAPE KEY
        ============================================================ */
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                document.querySelectorAll('.modal').forEach(modal => {
                    modal.style.display = 'none';
                });
                document.body.classList.remove('modal-open');
            }
        });
    </script>

</body>

</html>
