<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobster Ink - Group Status Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

    <style>
        :root {
            --primary: #1e293b;
            --primary-light: #334155;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --excel: #217346;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            border-left: 5px solid var(--accent);
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .header-date {
            text-align: right;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .header-date i {
            color: var(--accent);
            margin-right: 5px;
        }

        /* --- Upload Section --- */
        .upload-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 15px 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 250px;
            background: #f8fafc;
        }

        .upload-box:hover, .upload-box.dragover {
            border-color: var(--accent);
            background: #eff6ff;
        }

        .upload-box input[type="file"] {
            display: none;
        }

        .upload-box i {
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .upload-box p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .upload-box span {
            color: var(--accent);
            font-weight: 600;
        }

        /* --- Cache Section --- */
        .cache-section {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border-left: 4px solid var(--warning);
        }

        .cache-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-muted);
            flex: 1;
            min-width: 200px;
        }

        .cache-info i {
            color: var(--warning);
            font-size: 16px;
        }

        .cache-info strong {
            color: var(--primary);
        }

        .btn-save-cache {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
        }

        .btn-save-cache:hover {
            background-color: #059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
        }

        .btn-save-cache:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-clear-cache {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
        }

        .btn-clear-cache:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(239, 68, 68, 0.3);
        }

        /* --- KPI Cards --- */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
        }

        .kpi-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .kpi-icon.total { background: var(--accent); }
        .kpi-icon.active { background: var(--success); }
        .kpi-icon.inactive { background: var(--danger); }
        .kpi-icon.rate { background: var(--warning); }

        .kpi-info h3 {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-info p {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 2px;
        }

        /* --- Filters --- */
        .filters-section {
            display: flex;
            gap: 15px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .filter-select {
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--card-bg);
            cursor: pointer;
            min-width: 180px;
        }

        .filter-select:focus {
            border-color: var(--accent);
        }

        /* --- Delete Section --- */
        .delete-section {
            background: var(--card-bg);
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border-left: 4px solid var(--danger);
        }

        .delete-section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            white-space: nowrap;
        }

        .delete-section-label i {
            color: var(--danger);
            font-size: 16px;
        }

        .delete-select {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--card-bg);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .delete-select:focus {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .btn-delete-action {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .btn-delete-action:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(239, 68, 68, 0.3);
        }

        .btn-delete-action:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-restore {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: none;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
        }

        .btn-restore:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }

        /* --- Export Button --- */
        .btn-export {
            background-color: var(--excel);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .btn-export:hover {
            background-color: #185c37;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(33, 115, 70, 0.3);
        }

        .btn-export:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* --- Chart Section --- */
        .chart-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            width: 100%;
            max-width: 1330px;
            overflow-x: auto;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .chart-container {
            position: relative;
            width: 100%;
            min-width: 1000px;
            height: 680px;
        }

        /* --- Table Section --- */
        .table-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 700px;
            margin-bottom: 24px;
        }

        .table-responsive {
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-active {
            background-color: #d1fae5;
            color: #065f46;
        }

        .badge-inactive {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .total-row {
            background-color: var(--primary) !important;
            color: white !important;
            font-weight: 700;
        }

        .total-row td {
            color: white !important;
            border-bottom: none;
        }

        /* --- Loading --- */
        #loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--accent);
            font-weight: 600;
            font-size: 16px;
        }

        #loading i {
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* --- Toast Notification --- */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            color: var(--success);
            font-size: 18px;
        }

        .toast.warning i {
            color: var(--warning);
        }

        .toast.error i {
            color: var(--danger);
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .header-date {
                text-align: left;
            }
            .kpi-grid {
                grid-template-columns: 1fr 1fr;
            }
            .chart-container {
                height: 400px;
            }
            .delete-section, .cache-section {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <header class="header">
        <div class="header-title">
            <h1><i class="fa-solid fa-chart-pie" style="color: var(--accent);"></i> Lobster Ink Group Status</h1>
        </div>
        <div class="header-date">
            <i class="fa-regular fa-calendar"></i>
            <span id="currentDate"></span>
        </div>
    </header>

    <div class="upload-section">
        <div class="upload-box" id="uploadBox">
            <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p>Drag & Drop Excel file here or <span>Browse</span></p>
        </div>
    </div>

    <!-- *** قسم الكاش (الحفظ في المتصفح) *** -->
    <div class="cache-section" id="cacheSection" style="display: none;">
        <div class="cache-info">
            <i class="fa-solid fa-database"></i>
            <span id="cacheStatus">No data saved in cache</span>
        </div>
        <button class="btn-save-cache" id="saveCacheBtn">
            <i class="fa-solid fa-floppy-disk"></i> Save to Browser
        </button>
        <button class="btn-clear-cache" id="clearCacheBtn">
            <i class="fa-solid fa-trash-can"></i> Clear Cache
        </button>
    </div>

    <div class="kpi-grid" id="kpiGrid" style="display: none;">
        <div class="kpi-card">
            <div class="kpi-icon total"><i class="fa-solid fa-users"></i></div>
            <div class="kpi-info">
                <h3>Total Registered</h3>
                <p id="kpiTotal">0</p>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon active"><i class="fa-solid fa-user-check"></i></div>
            <div class="kpi-info">
                <h3>Active Learners</h3>
                <p id="kpiActive">0</p>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon inactive"><i class="fa-solid fa-user-xmark"></i></div>
            <div class="kpi-info">
                <h3>Inactive Learners</h3>
                <p id="kpiInactive">0</p>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon rate"><i class="fa-solid fa-percent"></i></div>
            <div class="kpi-info">
                <h3>Active Rate</h3>
                <p id="kpiRate">0%</p>
            </div>
        </div>
    </div>

    <div class="filters-section" id="filtersSection" style="display: none;">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search Department...">
        </div>
        <select class="filter-select" id="statusFilter">
            <option value="all">All Status</option>
            <option value="high">High Activity (>70%)</option>
            <option value="medium">Medium Activity (40-70%)</option>
            <option value="low">Low Activity (<40%)</option>
        </select>
        <!-- *** زر تصدير Excel *** -->
        <button class="btn-export" id="exportBtn">
            <i class="fa-solid fa-file-excel"></i> Export to Excel
        </button>
    </div>

    <div class="delete-section" id="deleteSection" style="display: none;">
        <div class="delete-section-label">
            <i class="fa-solid fa-trash-can"></i>
            <span>Delete Department:</span>
        </div>
        <select class="delete-select" id="deleteSelect">
            <option value="">-- Select a department to delete --</option>
        </select>
        <button class="btn-delete-action" id="deleteBtn" disabled>
            <i class="fa-solid fa-trash-can"></i> Delete
        </button>
        <button class="btn-restore" id="restoreBtn">
            <i class="fa-solid fa-rotate-left"></i> Restore Deleted
        </button>
    </div>

    <div id="loading"><i class="fa-solid fa-spinner"></i> Processing Data...</div>

    <div class="chart-card" id="chartCard" style="display: none;">
        <div class="chart-header">
        </div>
        <div class="chart-container">
            <canvas id="statusChart"></canvas>
        </div>
    </div>

    <div class="table-card" id="tableCard" style="display: none;">
        <div class="table-responsive">
            <table id="statusTable">
                <thead>
                    <tr>
                        <th>Department</th>
                        <th>Registered</th>
                        <th>Active</th>
                        <th>Inactive</th>
                        <th>Active %</th>
                        <th>Inactive %</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Toast Notification -->
<div class="toast" id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMessage">Department deleted successfully</span>
</div>

<script>
    // --- 1. الثوابت والمتغيرات ---
    const CACHE_KEY = 'lobster_ink_dashboard_cache';
    const CACHE_DURATION = 24 * 60 * 60 * 1000; // 24 ساعة بالميلي ثانية

    const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', dateOptions);

    const uploadBox = document.getElementById('uploadBox');
    const fileInput = document.getElementById('fileInput');
    const loading = document.getElementById('loading');
    const kpiGrid = document.getElementById('kpiGrid');
    const filtersSection = document.getElementById('filtersSection');
    const deleteSection = document.getElementById('deleteSection');
    const cacheSection = document.getElementById('cacheSection');
    const chartCard = document.getElementById('chartCard');
    const tableCard = document.getElementById('tableCard');
    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const deleteSelect = document.getElementById('deleteSelect');
    const deleteBtn = document.getElementById('deleteBtn');
    const restoreBtn = document.getElementById('restoreBtn');
    const saveCacheBtn = document.getElementById('saveCacheBtn');
    const clearCacheBtn = document.getElementById('clearCacheBtn');
    const cacheStatus = document.getElementById('cacheStatus');
    const exportBtn = document.getElementById('exportBtn');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');

    let globalData = [];
    let deletedItems = [];
    let chartInstance = null;

    // --- 2. دوال الكاش (localStorage) ---

    function saveToCache() {
        if (globalData.length === 0) {
            showToast('No data to save!', 'warning');
            return;
        }

        const cacheData = {
            data: globalData,
            deletedItems: deletedItems,
            timestamp: Date.now(),
            savedAt: new Date().toLocaleString('en-US')
        };

        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
            updateCacheStatus();
            showToast('Data saved to browser successfully!');
        } catch (e) {
            showToast('Failed to save data: ' + e.message, 'error');
        }
    }

    function loadFromCache() {
        try {
            const cached = localStorage.getItem(CACHE_KEY);
            if (!cached) return false;

            const cacheData = JSON.parse(cached);
            
            const age = Date.now() - cacheData.timestamp;
            if (age > CACHE_DURATION) {
                localStorage.removeItem(CACHE_KEY);
                updateCacheStatus();
                showToast('Cache expired (older than 24 hours)', 'warning');
                return false;
            }

            globalData = cacheData.data || [];
            deletedItems = cacheData.deletedItems || [];

            loading.style.display = 'none';
            kpiGrid.style.display = 'grid';
            filtersSection.style.display = 'flex';
            deleteSection.style.display = 'flex';
            cacheSection.style.display = 'flex';
            chartCard.style.display = 'block';
            tableCard.style.display = 'block';

            updateKPIs();
            updateDeleteDropdown();
            renderTable(globalData);
            renderChart(globalData);

            if (deletedItems.length > 0) {
                restoreBtn.style.display = 'inline-flex';
            }

            updateCacheStatus();
            showToast('Data loaded from browser cache!');
            return true;

        } catch (e) {
            console.error('Cache load error:', e);
            return false;
        }
    }

    function clearCache() {
        if (!localStorage.getItem(CACHE_KEY)) {
            showToast('No cache to clear', 'warning');
            return;
        }

        if (!confirm('Are you sure you want to clear the saved cache?')) return;

        localStorage.removeItem(CACHE_KEY);
        updateCacheStatus();
        showToast('Cache cleared successfully!', 'warning');
    }

    function updateCacheStatus() {
        try {
            const cached = localStorage.getItem(CACHE_KEY);
            if (!cached) {
                cacheStatus.innerHTML = '<strong>No data saved in cache</strong>';
                return;
            }

            const cacheData = JSON.parse(cached);
            const age = Date.now() - cacheData.timestamp;
            const remaining = CACHE_DURATION - age;

            if (remaining <= 0) {
                cacheStatus.innerHTML = '<strong>Cache expired</strong>';
                localStorage.removeItem(CACHE_KEY);
                return;
            }

            const hours = Math.floor(remaining / (60 * 60 * 1000));
            const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
            const savedAt = cacheData.savedAt || 'Unknown';
            const itemCount = cacheData.data ? cacheData.data.length : 0;

            cacheStatus.innerHTML = `Saved: <strong>${itemCount} departments</strong> | Saved at: <strong>${savedAt}</strong> | Expires in: <strong>${hours}h ${minutes}m</strong>`;
        } catch (e) {
            cacheStatus.innerHTML = '<strong>Cache error</strong>';
        }
    }

    // --- 3. تصدير إلى Excel ---
    function exportToExcel() {
        if (globalData.length === 0) {
            showToast('No data to export!', 'warning');
            return;
        }

        try {
            const sortedData = [...globalData].sort((a, b) => {
                const rateA = a.registered === 0 ? 0 : (a.active / a.registered);
                const rateB = b.registered === 0 ? 0 : (b.active / b.registered);
                return rateB - rateA;
            });

            let totalRegistered = 0;
            let totalActive = 0;

            sortedData.forEach(item => {
                totalRegistered += item.registered;
                totalActive += item.active;
            });

            const totalInactive = totalRegistered - totalActive;
            const totalActivePercent = totalRegistered === 0 ? 0 : Math.round((totalActive / totalRegistered) * 100);
            const totalInactivePercent = totalRegistered === 0 ? 0 : Math.round((totalInactive / totalRegistered) * 100);

            const exportData = [
                ['Lobster Ink - Group Status Report'],
                ['Generated:', new Date().toLocaleString('en-US')],
                [],
                ['Department', 'Registered', 'Active', 'Inactive', 'Active %', 'Inactive %']
            ];

            sortedData.forEach(item => {
                const inactive = item.registered - item.active;
                const activePercent = item.registered === 0 ? 0 : Math.round((item.active / item.registered) * 100);
                const inactivePercent = item.registered === 0 ? 0 : Math.round((inactive / item.registered) * 100);

                exportData.push([
                    item.dep,
                    item.registered,
                    item.active,
                    inactive,
                    activePercent + '%',
                    inactivePercent + '%'
                ]);
            });

            exportData.push([
                'Total',
                totalRegistered,
                totalActive,
                totalInactive,
                totalActivePercent + '%',
                totalInactivePercent + '%'
            ]);

            const ws = XLSX.utils.aoa_to_sheet(exportData);

            ws['!cols'] = [
                { wch: 25 },
                { wch: 12 },
                { wch: 10 },
                { wch: 10 },
                { wch: 10 },
                { wch: 12 }
            ];

            ws['!merges'] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 5 } },
                { s: { r: 1, c: 0 }, e: { r: 1, c: 5 } }
            ];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Group Status');

            const today = new Date();
            const dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            const fileName = `Lobster_Ink_Group_Status_${dateStr}.xlsx`;

            XLSX.writeFile(wb, fileName);

            showToast('Excel file exported successfully!');
        } catch (e) {
            console.error('Export error:', e);
            showToast('Failed to export: ' + e.message, 'error');
        }
    }

    // --- 4. أحداث رفع الملف ---
    uploadBox.addEventListener('click', () => fileInput.click());
    
    uploadBox.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadBox.classList.add('dragover');
    });

    uploadBox.addEventListener('dragleave', () => {
        uploadBox.classList.remove('dragover');
    });

    uploadBox.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadBox.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handleFile(e.target.files[0]);
        }
    });

    // --- 5. معالجة الملف ---
    function handleFile(file) {
        loading.style.display = 'block';
        kpiGrid.style.display = 'none';
        filtersSection.style.display = 'none';
        deleteSection.style.display = 'none';
        cacheSection.style.display = 'none';
        chartCard.style.display = 'none';
        tableCard.style.display = 'none';
        tableBody.innerHTML = '';
        deletedItems = [];
        restoreBtn.style.display = 'none';

        const reader = new FileReader();

        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            processData(jsonData);
        };

        reader.readAsArrayBuffer(file);
    }

    // --- 6. استخراج البيانات ---
    function processData(rows) {
        let headerRowIndex = -1;
        let colIndices = { name: -1, registered: -1, active: -1 };

        for (let i = 0; i < Math.min(rows.length, 10); i++) {
            const row = rows[i];
            if (!row) continue;

            const rowString = row.map(cell => String(cell).toLowerCase().trim());
            
            const nameIdx = rowString.findIndex(cell => cell.includes('learner group') || cell.includes('department') || cell.includes('dep'));
            const regIdx = rowString.findIndex(cell => cell.includes('registered') || cell.includes('current registered'));
            const actIdx = rowString.findIndex(cell => cell.includes('active learners') || cell.includes('active'));

            if (nameIdx !== -1 && regIdx !== -1 && actIdx !== -1) {
                headerRowIndex = i;
                colIndices.name = nameIdx;
                colIndices.registered = regIdx;
                colIndices.active = actIdx;
                break;
            }
        }

        if (headerRowIndex === -1) {
            alert("Could not find the required columns. Please ensure the file has columns for 'Learner Group Name', 'Current Registered Users (#)', and 'Active Learners (#)'.");
            loading.style.display = 'none';
            return;
        }

        const rawData = [];
        for (let i = headerRowIndex + 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;

            const depName = row[colIndices.name];
            const registered = Number(row[colIndices.registered]) || 0;
            const active = Number(row[colIndices.active]) || 0;

            if (!depName || String(depName).toLowerCase().includes('total')) continue;

            rawData.push({
                dep: depName,
                registered: registered,
                active: active
            });
        }

        rawData.sort((a, b) => {
            const rateA = a.registered === 0 ? 0 : (a.active / a.registered);
            const rateB = b.registered === 0 ? 0 : (b.active / b.registered);
            return rateB - rateA;
        });

        globalData = rawData;
        updateDashboard(globalData);
    }

    // --- 7. تحديث لوحة التحكم ---
    function updateDashboard(data) {
        loading.style.display = 'none';
        if (data.length === 0) {
            alert("No data found in the file.");
            return;
        }

        kpiGrid.style.display = 'grid';
        filtersSection.style.display = 'flex';
        deleteSection.style.display = 'flex';
        cacheSection.style.display = 'flex';
        chartCard.style.display = 'block';
        tableCard.style.display = 'block';

        updateKPIs();
        updateDeleteDropdown();
        renderTable(data);
        renderChart(data);
        updateCacheStatus();
    }

    // --- 8. تحديث مؤشرات KPI ---
    function updateKPIs() {
        let totalRegistered = 0;
        let totalActive = 0;

        globalData.forEach(item => {
            totalRegistered += item.registered;
            totalActive += item.active;
        });

        const totalInactive = totalRegistered - totalActive;
        const activeRate = totalRegistered === 0 ? 0 : Math.round((totalActive / totalRegistered) * 100);

        document.getElementById('kpiTotal').textContent = totalRegistered.toLocaleString();
        document.getElementById('kpiActive').textContent = totalActive.toLocaleString();
        document.getElementById('kpiInactive').textContent = totalInactive.toLocaleString();
        document.getElementById('kpiRate').textContent = activeRate + '%';
    }

    // --- 9. تحديث القائمة المنسدلة للحذف ---
    function updateDeleteDropdown() {
        deleteSelect.innerHTML = '<option value="">-- Select a department to delete --</option>';
        
        const sortedForDropdown = [...globalData].sort((a, b) => 
            a.dep.localeCompare(b.dep)
        );

        sortedForDropdown.forEach(item => {
            const option = document.createElement('option');
            option.value = item.dep;
            option.textContent = item.dep;
            deleteSelect.appendChild(option);
        });

        deleteBtn.disabled = true;
    }

    // --- 10. تفعيل/تعطيل زر الحذف ---
    deleteSelect.addEventListener('change', () => {
        deleteBtn.disabled = deleteSelect.value === '';
    });

    // --- 11. تنفيذ الحذف ---
    deleteBtn.addEventListener('click', () => {
        const depName = deleteSelect.value;
        if (!depName) return;

        if (!confirm(`Are you sure you want to delete "${depName}"?`)) return;

        const index = globalData.findIndex(item => item.dep === depName);
        if (index === -1) return;

        const deletedItem = globalData.splice(index, 1)[0];
        deletedItems.push(deletedItem);

        restoreBtn.style.display = 'inline-flex';

        deleteSelect.value = '';
        deleteBtn.disabled = true;

        updateKPIs();
        updateDeleteDropdown();
        applyFilters();

        showToast(`"${depName}" deleted successfully`);
    });

    // --- 12. استعادة الأقسام المحذوفة ---
    restoreBtn.addEventListener('click', () => {
        if (deletedItems.length === 0) return;

        const count = deletedItems.length;
        globalData = globalData.concat(deletedItems);
        deletedItems = [];

        globalData.sort((a, b) => {
            const rateA = a.registered === 0 ? 0 : (a.active / a.registered);
            const rateB = b.registered === 0 ? 0 : (b.active / b.registered);
            return rateB - rateA;
        });

        restoreBtn.style.display = 'none';

        updateKPIs();
        updateDeleteDropdown();
        applyFilters();

        showToast(`${count} department(s) restored successfully`);
    });

    // --- 13. إشعار Toast ---
    function showToast(message, type = 'success') {
        toastMessage.textContent = message;
        toast.className = 'toast show';
        if (type === 'warning') toast.classList.add('warning');
        if (type === 'error') toast.classList.add('error');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // --- 14. رسم الجدول ---
    function renderTable(data) {
        tableBody.innerHTML = '';
        let totalRegistered = 0;
        let totalActive = 0;

        const sortedData = [...data].sort((a, b) => {
            const rateA = a.registered === 0 ? 0 : (a.active / a.registered);
            const rateB = b.registered === 0 ? 0 : (b.active / b.registered);
            return rateB - rateA;
        });

        sortedData.forEach(item => {
            const inactive = item.registered - item.active;
            totalRegistered += item.registered;
            totalActive += item.active;

            const activePercent = item.registered === 0 ? 0 : Math.round((item.active / item.registered) * 100);
            const inactivePercent = item.registered === 0 ? 0 : Math.round((inactive / item.registered) * 100);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="font-weight: 600;">${item.dep}</td>
                <td>${item.registered}</td>
                <td style="color: var(--success); font-weight: 600;">${item.active}</td>
                <td style="color: var(--danger); font-weight: 600;">${inactive}</td>
                <td><span class="badge badge-active">${activePercent}%</span></td>
                <td><span class="badge badge-inactive">${inactivePercent}%</span></td>
            `;
            tableBody.appendChild(row);
        });

        const totalInactive = totalRegistered - totalActive;
        const totalActivePercent = totalRegistered === 0 ? 0 : Math.round((totalActive / totalRegistered) * 100);
        const totalInactivePercent = totalRegistered === 0 ? 0 : Math.round((totalInactive / totalRegistered) * 100);

        const totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        totalRow.innerHTML = `
            <td>Total</td>
            <td>${totalRegistered}</td>
            <td>${totalActive}</td>
            <td>${totalInactive}</td>
            <td>${totalActivePercent}%</td>
            <td>${totalInactivePercent}%</td>
        `;
        tableBody.appendChild(totalRow);
    }

    // --- 15. رسم الشارت ---
    function renderChart(data) {
        const ctx = document.getElementById('statusChart').getContext('2d');

        if (chartInstance) {
            chartInstance.destroy();
        }

        if (data.length === 0) {
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        datalabels: { display: false }
                    },
                    scales: {
                        x: { display: false },
                        y: { display: false }
                    }
                },
                plugins: [ChartDataLabels]
            });
            return;
        }

        const sortedData = [...data].sort((a, b) => {
            const rateA = a.registered === 0 ? 0 : (a.active / a.registered);
            const rateB = b.registered === 0 ? 0 : (b.active / b.registered);
            return rateB - rateA;
        });

        const labels = sortedData.map(item => item.dep);
        const activePercentData = sortedData.map(item => {
            return item.registered === 0 ? 0 : Math.round((item.active / item.registered) * 100);
        });
        const inactivePercentData = sortedData.map(item => {
            const inactive = item.registered - item.active;
            return item.registered === 0 ? 0 : Math.round((inactive / item.registered) * 100);
        });

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Active %',
                        data: activePercentData,
                        backgroundColor: '#10b981',
                        borderRadius: 4,
                        barPercentage: 0.7,
                        categoryPercentage: 0.6
                    },
                    {
                        label: 'Inactive %',
                        data: inactivePercentData,
                        backgroundColor: '#ef4444',
                        borderRadius: 4,
                        barPercentage: 0.7,
                        categoryPercentage: 0.6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: {
                        top: 30,
                        bottom: 10
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { 
                            font: { family: 'Inter', size: 14, weight: '600' },
                            padding: 20,
                            usePointStyle: true,
                            pointStyle: 'rect'
                        }
                    },
                    tooltip: {
                        backgroundColor: '#1e293b',
                        titleFont: { family: 'Inter', size: 14 },
                        bodyFont: { family: 'Inter', size: 13 },
                        padding: 10,
                        cornerRadius: 6,
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + context.parsed.y + '%';
                            }
                        }
                    },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        offset: 2,
                        color: function(context) {
                            return context.dataset.label === 'Active %' ? '#065f46' : '#991b1b';
                        },
                        font: {
                            weight: 'bold',
                            size: 12,
                            family: 'Inter'
                        },
                        formatter: function(value) {
                            return value > 0 ? value + '%' : '';
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { 
                            font: { family: 'Inter', size: 12, weight: '600' },
                            maxRotation: 45,
                            minRotation: 45,
                            color: '#334155'
                        }
                    },
                    y: {
                        beginAtZero: true,
                        max: 100,
                        grid: { color: '#e2e8f0', drawBorder: false },
                        ticks: { 
                            font: { family: 'Inter', size: 12 },
                            callback: function(value) {
                                return value + '%';
                            },
                            stepSize: 10
                        }
                    }
                }
            },
            plugins: [ChartDataLabels]
        });
    }

    // --- 16. الفلاتر والبحث ---
    function applyFilters() {
        const searchTerm = searchInput.value.toLowerCase();
        const statusValue = statusFilter.value;

        const filteredData = globalData.filter(item => {
            const matchesSearch = item.dep.toLowerCase().includes(searchTerm);
            
            const activePercent = item.registered === 0 ? 0 : Math.round((item.active / item.registered) * 100);
            
            let matchesStatus = true;
            if (statusValue === 'high') matchesStatus = activePercent > 70;
            else if (statusValue === 'medium') matchesStatus = activePercent >= 40 && activePercent <= 70;
            else if (statusValue === 'low') matchesStatus = activePercent < 40;

            return matchesSearch && matchesStatus;
        });

        renderTable(filteredData);
        renderChart(filteredData);
    }

    searchInput.addEventListener('input', applyFilters);
    statusFilter.addEventListener('change', applyFilters);

    // --- 17. أحداث أزرار الكاش والتصدير ---
    saveCacheBtn.addEventListener('click', saveToCache);
    clearCacheBtn.addEventListener('click', clearCache);
    exportBtn.addEventListener('click', exportToExcel);

    // --- 18. تحميل الكاش عند فتح الصفحة ---
    window.addEventListener('load', () => {
        updateCacheStatus();
        const loaded = loadFromCache();
        
        if (!loaded) {
            cacheSection.style.display = 'flex';
        }
    });

</script>

</body>
</html>
