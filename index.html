<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة التعليم والتطوير</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           BASE STYLES & RESET
           ============================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        #app {
            max-width: 100vw;
            overflow-x: hidden;
        }

        /* ============================================
           NAVBAR
           ============================================ */
        .navbar {
            background: linear-gradient(135deg, #0b2b4a, #1a4b6d);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            min-height: 70px;
        }

        .logo h2 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
        }

        .logo span {
            color: #7ec8e3;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #e0f0fa;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-2px);
        }

        /* ============================================
           HERO SECTION
           ============================================ */
        .hero {
            background: linear-gradient(135deg, #1a4b6d, #2a6b8f);
            color: white;
            text-align: center;
            padding: 3rem 1.5rem;
            margin: 0;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.3rem);
            opacity: 0.9;
        }

        /* ============================================
           SEARCH CONTAINER
           ============================================ */
        .search-container {
            max-width: 700px;
            margin: -1.5rem auto 1.5rem;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .search-box {
            background: white;
            border-radius: 50px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            padding: 0.3rem 0.3rem 0.3rem 1.5rem;
            transition: box-shadow 0.3s ease;
        }

        .search-box:focus-within {
            box-shadow: 0 8px 40px rgba(26, 75, 109, 0.25);
        }

        .search-icon {
            font-size: 1.2rem;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 0.8rem 0.8rem;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            background: transparent;
            min-width: 0;
            width: 100%;
        }

        .search-box input::placeholder {
            color: #aaa;
        }

        #searchResults {
            background: white;
            border-radius: 16px;
            margin-top: 0.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            max-height: 400px;
            overflow-y: auto;
            display: none;
            position: absolute;
            left: 1rem;
            right: 1rem;
            z-index: 100;
        }

        #searchResults.active {
            display: block;
        }

        #searchResults .search-item {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #searchResults .search-item:hover {
            background: #f5f9ff;
        }

        #searchResults .search-item:last-child {
            border-bottom: none;
        }

        /* ============================================
           CONTAINER & GRID
           ============================================ */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem 2rem;
        }

        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
            gap: 1.5rem;
        }

        /* ============================================
           SECTION CARDS
           ============================================ */
        .section-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .section-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }

        .section-card h3 {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            color: #1e3a5f;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-card .links-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .section-card .links-list a {
            color: #2a6b8f;
            text-decoration: none;
            padding: 0.5rem 0.8rem;
            border-radius: 10px;
            background: #f5f9ff;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            word-break: break-word;
        }

        .section-card .links-list a:hover {
            background: #e0f0fa;
            padding-right: 1.2rem;
        }

        .section-card .links-list a .link-icon {
            flex-shrink: 0;
        }

        /* ============================================
           FOOTER
           ============================================ */
        .footer {
            background: #0b2b4a;
            color: #aac7df;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-top: 2rem;
        }

        .footer p {
            font-size: clamp(0.85rem, 1.2vw, 1rem);
            margin: 0;
        }

        /* ============================================
           SCROLLBAR STYLING
           ============================================ */
        #searchResults::-webkit-scrollbar {
            width: 6px;
        }

        #searchResults::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 10px;
        }

        #searchResults::-webkit-scrollbar-thumb {
            background: #c0d0e0;
            border-radius: 10px;
        }

        #searchResults::-webkit-scrollbar-thumb:hover {
            background: #a0b8cc;
        }

        /* ============================================
           UTILITY CLASSES
           ============================================ */
        .section-card .links-list a,
        .search-item,
        .nav-links a {
            word-break: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }

        /* ============================================
           RESPONSIVE MEDIA QUERIES
           ============================================ */

        /* Tablets and small laptops (768px - 1024px) */
        @media screen and (max-width: 1024px) {
            .navbar {
                padding: 0.8rem 1.5rem;
            }

            .logo h2 {
                font-size: 1.3rem;
            }

            .nav-links a {
                font-size: 0.85rem;
                padding: 0.4rem 0.8rem;
            }

            .sections-grid {
                grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
                gap: 1.2rem;
            }

            .container {
                padding: 0 1.2rem 1.5rem;
            }
        }

        /* Mobile devices (up to 768px) */
        @media screen and (max-width: 768px) {
            .navbar {
                padding: 0.6rem 1rem;
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
                min-height: auto;
            }

            .logo {
                text-align: center;
            }

            .logo h2 {
                font-size: 1.1rem;
                white-space: normal;
            }

            .nav-links {
                justify-content: center;
                gap: 0.4rem;
            }

            .nav-links a {
                font-size: 0.8rem;
                padding: 0.3rem 0.6rem;
                white-space: normal;
                word-break: break-word;
                text-align: center;
            }

            .hero {
                padding: 2rem 1rem;
            }

            .hero h1 {
                font-size: 1.6rem;
            }

            .hero p {
                font-size: 0.95rem;
            }

            .search-container {
                padding: 0 0.8rem;
                margin-top: -1.2rem;
            }

            .search-box {
                padding: 0.2rem 0.2rem 0.2rem 1rem;
                border-radius: 40px;
            }

            .search-box input {
                padding: 0.6rem 0.6rem;
                font-size: 0.9rem;
            }

            .search-icon {
                font-size: 1rem;
            }

            #searchResults {
                left: 0.8rem;
                right: 0.8rem;
                max-height: 300px;
            }

            #searchResults .search-item {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            .container {
                padding: 0 0.8rem 1rem;
            }

            .sections-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .section-card {
                padding: 1.2rem;
            }

            .section-card h3 {
                font-size: 1.1rem;
            }

            .section-card .links-list a {
                font-size: 0.9rem;
                padding: 0.4rem 0.6rem;
            }

            .footer {
                padding: 1rem 0.8rem;
            }
        }

        /* Small mobile devices (up to 480px) */
        @media screen and (max-width: 480px) {
            .navbar {
                padding: 0.5rem 0.6rem;
            }

            .logo h2 {
                font-size: 0.95rem;
            }

            .nav-links {
                gap: 0.3rem;
                flex-wrap: wrap;
            }

            .nav-links a {
                font-size: 0.7rem;
                padding: 0.25rem 0.5rem;
                border-radius: 6px;
            }

            .hero {
                padding: 1.5rem 0.8rem;
            }

            .hero h1 {
                font-size: 1.3rem;
            }

            .hero p {
                font-size: 0.85rem;
            }

            .search-container {
                padding: 0 0.5rem;
                margin-top: -1rem;
            }

            .search-box {
                padding: 0.15rem 0.15rem 0.15rem 0.8rem;
                border-radius: 30px;
            }

            .search-box input {
                padding: 0.5rem 0.5rem;
                font-size: 0.8rem;
            }

            .search-icon {
                font-size: 0.85rem;
            }

            #searchResults {
                left: 0.5rem;
                right: 0.5rem;
                max-height: 250px;
                border-radius: 12px;
            }

            #searchResults .search-item {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }

            .container {
                padding: 0 0.5rem 0.8rem;
            }

            .sections-grid {
                gap: 0.8rem;
            }

            .section-card {
                padding: 0.8rem;
                border-radius: 16px;
            }

            .section-card h3 {
                font-size: 0.95rem;
                margin-bottom: 0.6rem;
            }

            .section-card .links-list {
                gap: 0.3rem;
            }

            .section-card .links-list a {
                font-size: 0.8rem;
                padding: 0.35rem 0.5rem;
                border-radius: 8px;
            }

            .footer {
                padding: 0.8rem 0.5rem;
            }

            .footer p {
                font-size: 0.75rem;
            }
        }

        /* Ultra-wide screens (1440px and above) */
        @media screen and (min-width: 1440px) {
            .container {
                max-width: 1600px;
                padding: 0 2.5rem 2.5rem;
            }

            .sections-grid {
                grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
                gap: 2rem;
            }

            .section-card {
                padding: 2rem;
                border-radius: 24px;
            }

            .section-card h3 {
                font-size: 1.5rem;
            }

            .section-card .links-list a {
                font-size: 1.05rem;
                padding: 0.6rem 1rem;
            }

            .navbar {
                padding: 1rem 3rem;
            }

            .logo h2 {
                font-size: 1.8rem;
            }

            .hero {
                padding: 4rem 2rem;
            }

            .hero h1 {
                font-size: 3.5rem;
            }

            .search-container {
                max-width: 800px;
            }

            .search-box input {
                font-size: 1.1rem;
                padding: 1rem 1rem;
            }
        }

        /* Landscape orientation for mobile */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            .navbar {
                min-height: 50px;
                padding: 0.4rem 1rem;
            }

            .logo h2 {
                font-size: 1rem;
            }

            .hero {
                padding: 1rem 1rem;
            }

            .hero h1 {
                font-size: 1.4rem;
            }

            .hero p {
                font-size: 0.85rem;
            }

            .search-container {
                margin-top: -0.8rem;
            }

            .search-box input {
                padding: 0.4rem 0.6rem;
            }

            .sections-grid {
                grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr));
                gap: 0.6rem;
            }

            .section-card {
                padding: 0.8rem;
            }
        }

        /* Touch-friendly targets on mobile */
        @media (pointer: coarse) {
            .nav-links a,
            .section-card .links-list a,
            .search-item {
                min-height: 44px;
                display: flex;
                align-items: center;
            }
        }
    </style>
    
    <!-- تحويل ملفات الجافاسكريبت لتعمل بنظام Modules -->
    <script type="module" src="database.js"></script>
    <script type="module" src="auth-guard.js"></script>
</head>
<body>
    <div id="app">
        <!-- شاشة انتظار بسيطة لحين رد سيرفر Firebase بحالة المصادقة -->
        <div style="text-align:center; padding:100px 20px; font-family:'Tajawal', sans-serif; color:#1e3a5f;">
            <h2>جاري تهيئة مساحة العمل والتحقق من الصلاحيات... ⏳</h2>
        </div>
    </div>

    <!-- استدعاء سكريبت العمليات الأساسية -->
    <script type="module" src="script.js"></script>
    
    <script type="module">
        import { auth } from './database.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const appContainer = document.getElementById('app');

        // الاستماع لحالة المستخدم من Firebase
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // المستخدم مسجل الدخول، يتم بناء وعرض الواجهة
                appContainer.innerHTML = `
                    <div class="navbar">
                        <div class="logo">
                            <h2>🎓 <span>نظام</span> إدارة التعليم والتطوير</h2>
                        </div>
                        <div class="nav-links" id="navLinks"></div>
                    </div>

                    <div class="hero">
                        <h1>نظام إدارة التعليم والتطوير</h1>
                        <p>منصة متكاملة لإدارة التدريب</p>
                    </div>

                    <!-- شريط البحث -->
                    <div class="search-container">
                        <div class="search-box">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="searchInput" placeholder="ابحث عن قسم أو رابط...">
                        </div>
                        <div id="searchResults"></div>
                    </div>

                    <div class="container">
                        <div class="sections-grid" id="sectionsContainer"></div>
                    </div>

                    <div class="footer">
                        <p>© 2026 نظام إدارة التعليم والتطوير - جميع الحقوق محفوظة</p>
                    </div>
                `;
                
                // ربط حدث البحث عبر EventListener (لأن onkeyup في HTML المدمج لا يتعرف على الـ Modules بسهولة)
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('keyup', () => {
                        if (typeof window.searchContent === 'function') window.searchContent();
                    });
                }

                // تهيئة محتويات الصفحة بالاعتماد على الدوال الموجودة في script.js
                // ملاحظة: تأكد أن script.js يقوم بتصدير هذه الدوال أو إضافتها لـ window
                setTimeout(() => {
                    if (typeof window.updateNavbar === 'function') window.updateNavbar();
                    if (typeof window.renderSections === 'function') window.renderSections();
                }, 100);
            }
            // إذا لم يكن مسجلاً، ملف auth-guard.js سيقوم تلقائياً بالتوجيه لصفحة login.html
        });
    </script>
</body>
</html>
